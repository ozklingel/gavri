<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><?= pageTitle ?></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Heebo:wght@300;400;600;700;900&display=swap');

    :root {
      --bg:        transparent;
      --bg2:       rgba(248, 252, 249, 0.82);
      --bg3:       rgba(240, 247, 243, 0.88);
      --bg4:       rgba(230, 242, 235, 0.94);
      --glass:     rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(245, 250, 247, 0.88);
      --glass-heavy: rgba(236, 245, 239, 0.92);
      --overlay-dim: rgba(255, 255, 255, 0.28);
      --scrim:     rgba(20, 45, 30, 0.32);
      --border:    #c5dcc8;
      --border2:   #7cb896;
      --green:     #15803d;
      --green2:    #16a34a;
      --green3:    #14532d;
      --green-dim: #bbf7d0;
      --text:      #1a2e22;
      --text2:     #166534;
      --text3:     #15803d;
      --muted:     #5a7d68;
      --danger:    #dc2626;
      --danger-bg: #fef2f2;
      --warn:      #d97706;
      --mono:      'Share Tech Mono', monospace;
      --body:      'Heebo', sans-serif;
      --radius:    6px;
      --shadow:    0 4px 24px rgba(30, 60, 40, 0.12);
      --shadow-lg: 0 8px 32px rgba(30, 60, 40, 0.18);
      --heading-on-bg: #ffffff;
      --heading-on-bg-shadow: 0 1px 4px rgba(20, 45, 30, 0.85), 0 0 14px rgba(20, 45, 30, 0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: transparent;
  color: var(--text);
  font-family: var(--body);
  font-size: 14px;
  min-height: 100vh;

  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  position: relative;
}

#app-bg.app-bg-img {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  z-index: 0;
  pointer-events: none;
}

/* מובייל: זום אאוט — הצגת כל תמונת הרקע בלי חיתוך אגרסיבי */
@media (max-width: 768px), (orientation: portrait) and (max-width: 1024px) {
  html, body {
    background: #eef5f0;
  }
  #app-bg.app-bg-img {
    object-fit: contain;
    object-position: center center;
    width: 100%;
    height: 100%;
  }
}
#app-bg-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: var(--overlay-dim);
  pointer-events: none;
}
#app-content,
#app-splash,
#page-loader {
  position: relative;
  z-index: 2;
}

* {
  box-sizing: border-box;
  max-width: 100%;
}

    /* ── TOPBAR ── */
    .topbar {
  background: var(--glass-strong);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border2);
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 100;

  width: 100%;
  max-width: 100%;
  overflow: hidden;
}
    .topbar-brand {
      font-family: var(--mono);
      color: var(--green);
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-brand .star { color: var(--green); font-size: 20px; }
    .topbar-brand .sub { color: var(--muted); font-size: 11px; display: block; line-height: 1; }
    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topbar-user {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text2);
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: var(--radius);
      margin-left: 10px;
    }
    .topbar-start {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .topbar-menu-btn {
      flex-shrink: 0;
      font-size: 18px;
      line-height: 1;
      padding: 6px 10px;
      min-width: 44px;
      min-height: 44px;
    }
    .topbar-back-btn {
      display: none !important;
    }
    /* ── FLOAT NAV (חזרה / קדימה) ── */
    .app-float-nav {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      inset-inline-start: max(14px, env(safe-area-inset-left));
      z-index: 12500;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .app-float-nav:not([hidden]) {
      pointer-events: auto;
    }
    .app-float-nav-btn {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      padding: 12px 16px;
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid var(--border2);
      background: var(--glass-heavy);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--green3);
      box-shadow: 0 4px 20px rgba(20, 45, 30, 0.22);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
    }
    .app-float-nav-btn:hover {
      background: var(--bg4);
      box-shadow: 0 6px 24px rgba(20, 45, 30, 0.28);
    }
    .app-float-nav-btn:active {
      transform: scale(0.97);
    }
    .app-float-nav-btn[hidden] {
      display: none !important;
    }
    a.topbar-brand {
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    a.topbar-brand:hover { color: var(--green); }

    /* ── APP DRAWER (mobile + desktop) ── */
    .app-drawer-overlay {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      z-index: 200;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .app-drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .app-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(360px, 92vw);
      max-width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg2);
      border-left: 2px solid var(--border2);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s ease;
      box-shadow: -8px 0 32px rgba(30, 60, 40, 0.15);
      overflow: hidden;
    }
    .app-drawer.open {
      transform: translateX(0);
    }
    body.drawer-open {
      overflow: hidden;
      touch-action: none;
    }
    .app-drawer-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 14px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg3);
    }
    .app-drawer-identity {
      min-width: 0;
      flex: 1;
    }
    .app-drawer-user-name {
      font-family: var(--body);
      font-size: 17px;
      font-weight: 700;
      color: var(--text1);
      line-height: 1.35;
      word-break: break-word;
    }
    .app-drawer-user-role {
      font-family: var(--body);
      font-size: 13px;
      color: var(--text2);
      margin-top: 4px;
      line-height: 1.3;
    }
    .app-drawer-brand {
      font-family: var(--mono);
      color: var(--green);
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .app-drawer-brand .star { font-size: 18px; flex-shrink: 0; }
    .app-drawer-brand .sub {
      color: var(--muted);
      font-size: 10px;
      display: block;
      line-height: 1.2;
      font-weight: normal;
    }
    .app-drawer-close {
      flex-shrink: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text1);
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .app-drawer-close:hover { border-color: var(--green); color: var(--green); }
    .app-drawer-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .app-drawer-nav {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .app-drawer-panels {
      padding: 0 10px 12px;
      border-top: 1px solid var(--border);
    }
    .app-drawer-panels .card {
      margin-bottom: 10px;
    }
    .app-drawer-panels .card-body {
      overflow-x: auto;
    }
    .app-drawer-panels .tbl {
      font-size: 11px;
    }
    .app-drawer-panels .stat-num {
      font-size: 18px;
    }
    .drawer-section-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: bold;
      color: var(--green);
      margin: 12px 0 8px;
      padding-top: 4px;
    }
    .app-drawer-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text1);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 14px;
      min-height: 48px;
      transition: border-color 0.15s, background 0.15s;
    }
    .app-drawer-link:hover,
    .app-drawer-link:focus {
      border-color: var(--green);
      background: var(--bg4);
      color: var(--green);
      outline: none;
    }
    .app-drawer-link-icon {
      font-size: 20px;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .app-drawer-foot {
      padding: 12px 14px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--green3);
      color: #fff;
      border: 1px solid var(--green2);
    }
    .btn-primary:hover { background: var(--green2); color: #fff; }
    button.btn-primary,
    a.btn-primary,
    input.btn-primary[type="submit"] {
      color: #fff !important;
    }
    button.btn-primary:hover,
    a.btn-primary:hover,
    input.btn-primary[type="submit"]:hover {
      color: #fff !important;
    }
    .btn-secondary {
      background: var(--bg4);
      color: var(--text2);
      border: 1px solid var(--border2);
    }
    .btn-secondary:hover { border-color: var(--green); color: var(--green); }
    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--green2); color: var(--green); }
    .btn-danger {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fca5a5;
    }
    .btn-danger:hover { background: #fee2e2; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .btn-lg { padding: 10px 22px; font-size: 14px; }
    .btn-full { width: 100%; justify-content: center; }
    .btn-icon { padding: 5px 8px; }

    /* ── LINKS as buttons ── */
    a.btn { color: inherit; }
    a.btn-primary { color: #fff !important; }
    a.btn-primary:hover { color: #fff !important; }
    a.btn-secondary { color: var(--text2); }
    a.btn-secondary:hover { color: var(--green); }
    a.btn-ghost:hover { color: var(--green); }

    /* ── USER NAME LINKS ── */
    a.user-name-link,
    .user-name-link {
      color: var(--blue, #2563eb);
      text-decoration: underline;
      cursor: pointer;
    }
    a.user-name-link:hover,
    .user-name-link:hover { color: #1d4ed8; }
    a.whatsapp-link,
    .whatsapp-link {
      color: #128C7E;
      text-decoration: underline;
      direction: ltr;
      display: inline-block;
      unicode-bidi: isolate;
    }
    a.whatsapp-link:hover,
    .whatsapp-link:hover { color: #075E54; }
    .app-drawer-user-name .user-name-link { color: inherit; text-decoration: none; font-weight: bold; }
    .app-drawer-user-name .user-name-link:hover { color: var(--green); text-decoration: underline; }
    .assign-chip .user-name-link { color: var(--text1); text-decoration: underline; }
    .assign-chip .user-name-link:hover { color: var(--blue, #2563eb); }
    .ex-matrix-person-name .user-name-link { color: inherit; }
    a.exercise-name-link,
    .exercise-name-link {
      color: var(--blue, #2563eb);
      text-decoration: underline;
      cursor: pointer;
    }
    a.exercise-name-link:hover,
    .exercise-name-link:hover { color: #1d4ed8; }
    .assign-ex-row-title .exercise-name-link { font-weight: 700; font-size: inherit; color: inherit; text-decoration: underline; }
    .assign-ex-row-title .exercise-name-link:hover { color: var(--blue, #2563eb); }
    .team-matrix-ex-title .exercise-name-link { font-weight: bold; color: inherit; text-decoration: underline; }
    .team-matrix-tbl th .team-matrix-ex-title .exercise-name-link,
    .ex-matrix-tbl th .team-matrix-ex-title .exercise-name-link {
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .team-matrix-ex-title .exercise-name-link:hover { color: var(--blue, #2563eb); }
    .timeline-track.edit-mode .tl-bar-label .exercise-name-link {
      pointer-events: auto;
      cursor: pointer;
      position: relative;
      z-index: 4;
      text-decoration: underline;
    }

    /* ── LAYOUT ── */
    .page { padding: 16px 20px 40px; max-width: 1100px; margin: 0 auto; }
    .page-dashboard {
      max-width: none;
      width: 100%;
      box-sizing: border-box;
    }
    .dashboard-search-panel {
      width: 100%;
      margin-bottom: 20px;
      position: relative;
    }
    .dashboard-search-label {
      margin-bottom: 8px;
      font-size: 13px;
    }
    .dashboard-search-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
      width: 100%;
    }
    .dashboard-search-input {
      width: 100%;
      font-size: 15px;
      padding: 12px 14px;
      min-height: 48px;
    }
    .dashboard-search-btn {
      min-width: 96px;
      min-height: 48px;
      flex-shrink: 0;
    }
    .dashboard-search-results {
      position: relative;
      top: auto;
      left: auto;
      right: auto;
      width: 100%;
      margin-top: 8px;
      max-height: min(50vh, 420px);
    }
    #dashboardUserExerciseResults {
      width: 100%;
    }
    .user-cal-body {
      padding: 14px 16px;
    }
    .user-cal-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .user-cal-month-label {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--text2);
      min-width: 140px;
      text-align: center;
    }
    .user-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      background: rgba(255, 255, 255, 0.55);
    }
    .user-cal-dow {
      text-align: center;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      padding: 4px 0;
    }
    .user-cal-day {
      min-height: 84px;
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 4px;
      background: var(--bg3);
      cursor: default;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .user-cal-day.empty {
      background: transparent;
      border-color: transparent;
      pointer-events: none;
    }
    .user-cal-day.other-month {
      opacity: 0.45;
    }
    .user-cal-day.today {
      border-color: var(--green);
      box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.35);
    }
    .user-cal-day.has-events {
      cursor: pointer;
    }
    .user-cal-day.has-events:hover {
      border-color: var(--green);
      background: rgba(74, 222, 128, 0.06);
    }
    .user-cal-day-num {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--text2);
      line-height: 1.2;
    }
    .user-cal-day.today .user-cal-day-num {
      color: var(--green);
    }
    .user-cal-event {
      font-size: 8px;
      line-height: 1.15;
      padding: 1px 3px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .user-cal-event.type-green { background: rgba(74, 222, 128, 0.35); border-color: #22c55e; color: #14532d; }
    .user-cal-event.type-blue { background: rgba(96, 165, 250, 0.35); border-color: #3b82f6; color: #1e3a8a; }
    .user-cal-event.type-yellow { background: rgba(251, 191, 36, 0.4); border-color: #f59e0b; color: #78350f; }
    .user-cal-event.type-muted { background: rgba(148, 163, 184, 0.3); border-color: #94a3b8; color: #334155; }
    .user-cal-more {
      font-size: 9px;
      color: var(--muted);
      font-family: var(--mono);
      padding: 0 2px;
    }
    .proc-add-panel {
      border-bottom: 1px solid var(--border);
      background: rgba(74, 222, 128, 0.04);
    }

    .user-cal-day-detail {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg3);
    }
    .user-cal-day-detail h4 {
      margin: 0 0 8px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text2);
    }
    .user-cal-detail-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border2);
      font-size: 12px;
      line-height: 1.45;
    }
    .user-cal-detail-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    @media (max-width: 700px) {
      .user-cal-day { min-height: 56px; }
      .user-cal-event { display: none; }
      .user-cal-day.has-events .user-cal-day-num::after {
        content: ' •';
        color: var(--green);
      }
    }
    .dash-proc-panel {
      padding: 10px 14px 12px;
    }
    .dash-proc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .dash-proc-tbl th,
    .dash-proc-tbl td {
      font-size: 11px;
    }
    .dash-proc-btn.active {
      border-color: #d97706;
      color: #b45309;
      background: rgba(245, 158, 11, 0.14);
    }
    .dash-proc-open-btn {
      margin-top: 6px;
    }
    .dashboard-tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-gutter: stable;
    }
    .dashboard-tab {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--border);
      border-radius: 6px 6px 0 0;
    }
    button.dashboard-tab,
    button.lazy-tab-btn,
    button.tab-link.lazy-tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font: inherit;
    }
    .lazy-tab-panel[hidden] {
      display: none !important;
    }
    .dashboard-tab:hover {
      color: var(--text2);
    }
    .dashboard-tab.active {
      color: var(--green3);
      border-bottom-color: var(--green);
      border-color: var(--green);
      background: var(--green-dim);
      font-weight: bold;
    }
    .dashboard-tab-panel {
      width: 100%;
    }
    /* דשבורד — רקע בהיר לניגודיות מול תמונת הרקע */
    .page-dashboard .spa-tabs-bar.tabs {
      background: rgba(255, 255, 255, 0.94) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border2);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 8px 10px 0;
      margin-bottom: 0;
      box-shadow: var(--shadow);
    }
    .page-dashboard .spa-tabs-bar .tab-link {
      background: rgba(255, 255, 255, 0.88) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px 6px 0 0;
      margin-inline: 2px;
      padding: 10px 14px;
      color: var(--text) !important;
    }
    .page-dashboard .spa-tabs-bar .tab-link.active {
      background: var(--green-dim) !important;
      color: var(--green3) !important;
      border-color: var(--green) !important;
      border-bottom-color: var(--green-dim) !important;
    }
    .page-dashboard .dashboard-shell {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border2);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      padding: 16px;
    }
    .page-dashboard .dashboard-tab-panel .card {
      background: var(--glass) !important;
    }
    .page-dashboard .btn-ghost,
    .page-dashboard .btn-secondary {
      background: var(--glass) !important;
      border: 1px solid var(--border2);
    }
    .page-dashboard .dashboard-search-panel {
      margin-bottom: 16px;
    }
    .page-title {
      font-family: var(--mono);
      font-size: 20px;
      color: var(--heading-on-bg);
      text-shadow: var(--heading-on-bg-shadow);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title::before {
      content: '▌';
      color: var(--green-dim);
      text-shadow: var(--heading-on-bg-shadow);
    }

    /* ── ASSIGNMENT BOARD ── */
    .page-assign .assign-changes-bar {
      margin-bottom: 14px;
      padding: 12px 14px;
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: var(--radius);
    }
    .page-assign .assign-changes-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .page-assign .assign-changes-title {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--amber, #fbbf24);
    }
    .page-assign .assign-changes-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .page-assign .assign-changes-list {
      list-style: none;
      margin: 0 0 12px;
      padding: 0;
      max-height: 160px;
      overflow-y: auto;
    }
    .page-assign .assign-change-item {
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: var(--glass);
      border-radius: 4px;
      border-right: 3px solid var(--border2);
    }
    .page-assign .assign-change-add { border-right-color: var(--green2); }
    .page-assign .assign-change-remove { border-right-color: var(--danger, #f87171); }
    .page-assign .assign-change-move { border-right-color: var(--blue, #60a5fa); }
    .page-assign .assign-change-resp { border-right-color: var(--amber, #fbbf24); }
    .page-assign .assign-changes-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .page-assign .assign-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .page-assign .assign-panel-head {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text2);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .page-assign .assign-panel-sub {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px;
    }
    .page-assign .assign-users-col {
      position: sticky;
      top: 8px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }
    .page-assign .assign-users-block + .assign-users-block {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .page-assign .assign-mm-block .assign-panel-head {
      color: var(--blue, #60a5fa);
    }
    .page-assign .assign-users-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 80px;
    }
    .page-assign .assign-users-list.drag-over {
      background: rgba(74, 222, 128, 0.06);
      border-radius: 6px;
    }
    .page-assign .assign-users-empty {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      padding: 12px 4px;
      text-align: center;
    }
    .page-assign .assign-exercises-col {
      min-width: 0;
    }
    .page-assign .assign-exercises-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .page-assign .assign-ex-row {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .page-assign .assign-ex-row-needs {
      border-color: rgba(251, 191, 36, 0.45);
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.12);
    }
    .page-assign .assign-ex-row-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg4);
    }
    .page-assign .assign-ex-row-title {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text1);
      margin-bottom: 2px;
    }
    .page-assign .assign-ex-row-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }
    .page-assign .assign-ex-row-zone {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
      padding: 10px 14px;
      min-height: 52px;
    }
    .page-assign .assign-ex-row-zone.is-empty::after {
      content: '// גרור חניך לכאן';
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      padding: 8px 2px;
    }
    .page-assign .assign-ex-row-zone.drag-over {
      background: rgba(74, 222, 128, 0.07);
    }
    .page-assign .assign-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: grab;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text1);
      user-select: none;
    }
    .page-assign .assign-ex-row-zone .assign-chip {
      max-width: 220px;
    }
    .page-assign .assign-count-badge {
      font-size: 9px;
      color: var(--muted);
      background: var(--glass);
      padding: 2px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .page-assign .assign-chip-pool {
      border-style: dashed;
      width: 100%;
    }
    @media (max-width: 900px) {
      .page-assign .assign-layout {
        grid-template-columns: 1fr;
      }
      .page-assign .assign-users-col {
        position: static;
        max-height: none;
      }
    }

    /* ── GRID LAYOUTS ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

    /* ── CARD ── */
    .card {
      background: var(--glass);
      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-header {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--green);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-body { padding: 14px; }
    .card-actions {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* ── COLLAPSIBLE ── */
    .collapsible { }
    .collapsible-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: right;
      cursor: pointer;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--green);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 2px;
      box-sizing: border-box;
    }
    .collapsible-toggle:hover { border-color: var(--border2); background: var(--bg4); }
    .collapsible-toggle .arrow { transition: transform 0.2s; }
    .collapsible-content { display: none; }
    .collapsible-content.open { display: block; }
    .coll-open .arrow { transform: rotate(180deg); }
    a.collapsible-toggle {
      text-decoration: none;
      box-sizing: border-box;
    }
    .expandable-closed-wrap { margin-bottom: 2px; }
    .expandable-closed {
      display: flex;
      margin-bottom: 0;
    }
    .expandable-stack .collapsible-toggle,
    .expandable-stack .expandable-closed {
      background: var(--glass-heavy) !important;
      color: var(--green3);
      border-color: var(--border2);
      box-shadow: 0 1px 4px rgba(20, 45, 30, 0.08);
    }
    .expandable-stack .collapsible-toggle:hover,
    .expandable-stack .expandable-closed:hover {
      background: var(--bg4) !important;
      border-color: var(--green2);
    }
    .expandable-panel-body {
      background: var(--glass-heavy) !important;
      border: 1px solid var(--border2);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      padding: 14px 16px 16px;
      margin-bottom: 8px;
      color: var(--text);
      box-shadow: 0 2px 10px rgba(20, 45, 30, 0.06);
    }
    .expandable-panel-body p,
    .expandable-panel-body li,
    .expandable-panel-body td,
    .expandable-panel-body span {
      color: var(--text);
    }
    .expandable-panel-body p[style*="color:var(--muted)"],
    .expandable-panel-body li[style*="color:var(--muted)"],
    .expandable-panel-body .rules-muted {
      color: var(--text2) !important;
    }
    .expandable-panel-body a {
      color: #1d4ed8;
      text-decoration: underline;
      font-weight: 600;
    }
    .expandable-panel-body a:hover {
      color: #1e40af;
    }
    .expandable-panel-body .tbl th {
      background: var(--bg4) !important;
      color: var(--green3);
      border-bottom: 2px solid var(--border2);
    }
    .expandable-panel-body .tbl td {
      background: rgba(255, 255, 255, 0.92) !important;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }
    .expandable-panel-body .tbl tr:hover td {
      background: rgba(240, 247, 243, 0.98) !important;
    }
    .expandable-panel-body .tbl .mono {
      color: var(--green3);
    }
    .expandable-panel-body .rules-warn {
      color: #b45309 !important;
      background: rgba(254, 243, 199, 0.65);
      border: 1px solid rgba(217, 119, 6, 0.35);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .spa-tab-panel { width: 100%; }

    /* ── TABLE ── */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th {
      background: var(--bg3);
      color: var(--green2);
      font-family: var(--mono);
      font-size: 11px;
      text-align: right;
      padding: 7px 10px;
      border-bottom: 2px solid var(--border2);
      white-space: nowrap;
    }
    .tbl td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr:hover td { background: var(--bg3); }
    .tbl .mono { font-family: var(--mono); color: var(--green2); font-size: 12px; }
    .tbl td .actions { display: inline-flex; gap: 5px; flex-wrap: wrap; align-items: center; }

    /* ── TIME WHEEL (חצי שעה) ── */
    .time-wheel-wrap {
      position: relative;
      display: flex;
      align-items: stretch;
      gap: 4px;
    }
    .time-wheel-wrap .time-half-input {
      flex: 1;
      min-width: 0;
    }
    .time-wheel-btn {
      flex-shrink: 0;
      width: 36px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg3);
      color: var(--green2);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }
    .time-wheel-btn:hover { border-color: var(--green); background: var(--bg4); }
    .time-wheel-popup {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      left: 0;
      z-index: 1200;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .time-wheel-popup[hidden] { display: none; }
    .time-wheel-list {
      max-height: 160px;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 56px 0;
    }
    .time-wheel-item {
      height: 32px;
      line-height: 32px;
      text-align: center;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text2);
      cursor: pointer;
      scroll-snap-align: center;
      user-select: none;
    }
    .time-wheel-item:hover { background: var(--bg3); color: var(--green); }
    .time-wheel-item.selected { color: var(--green); font-weight: 700; background: rgba(74,222,128,0.08); }
    .time-wheel-list::before,
    .time-wheel-list::after {
      content: '';
      position: sticky;
      display: block;
      height: 56px;
      pointer-events: none;
      z-index: 1;
    }
    .time-wheel-list::before {
      top: 0;
      margin-bottom: -56px;
      background: linear-gradient(var(--bg2), transparent);
    }
    .time-wheel-list::after {
      bottom: 0;
      margin-top: -56px;
      background: linear-gradient(transparent, var(--bg2));
    }

    /* ── נוהל קרב — טבלה ── */
    .proc-tbl .proc-actions-head,
    .proc-tbl .proc-actions-cell {
      width: 118px;
      white-space: nowrap;
      text-align: center;
    }
    .proc-tbl tr.proc-edit-row { display: none; }
    .proc-tbl tr.proc-edit-row.is-open { display: table-row; }
    .proc-tbl .proc-edit-cell {
      background: var(--bg2);
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .proc-tbl .proc-edit-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .proc-tbl tr.proc-row:hover .proc-actions-cell { background: transparent; }

    /* ── FORM ── */
    .form-row { margin-bottom: 12px; }
    .form-label {
      display: block;
      color: var(--text2);
      font-size: 12px;
      font-family: var(--mono);
      margin-bottom: 4px;
    }
    .form-input, .form-select, .form-textarea {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 7px 10px;
      font-family: var(--body);
      font-size: 13px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(74,222,128,0.1);
    }
    .form-select option { background: var(--bg2); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-inline { display: flex; gap: 8px; align-items: flex-end; }
    .form-inline .form-row { flex: 1; margin-bottom: 0; }

    /* ── BADGE ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-family: var(--mono);
      font-weight: bold;
    }
    .badge-green { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .badge-yellow { background: #fef3c7; color: #b45309; border: 1px solid #fcd34d; }
    .badge-blue { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
    .badge-muted { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }

    /* ── FLASH ── */
    .flash {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .flash-info { background: #ecfdf5; border: 1px solid var(--green3); color: var(--text2); }
    .flash-error { background: var(--danger-bg); border: 1px solid #b91c1c; color: var(--danger); }

    /* ── DIVIDER ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

    /* ── STAT BOX ── */
    .stat-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
    }
    .stat-num { font-family: var(--mono); font-size: 28px; color: var(--green); line-height: 1; }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: var(--mono); }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 30px; color: var(--muted); font-family: var(--mono); font-size: 13px; }
    .empty::before { content: '//'; margin-left: 5px; }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-title {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── EXERCISE ROW card ── */
    .ex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .ex-row:last-child { border-bottom: none; }
    .ex-row:hover { background: var(--bg3); }
    .ex-info { flex: 1; min-width: 0; }
    .ex-title { font-weight: 600; font-size: 13px; color: var(--text); }
    .ex-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
    .ex-btns { display: flex; gap: 5px; flex-shrink: 0; }

    /* ── LOGIN ── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    .login-box {
      width: 380px;
      background: var(--glass-strong);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border2);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow), 0 0 60px rgba(34,197,94,0.06);
    }
    .login-head {
      background: var(--bg3);
      border-bottom: 2px solid var(--green3);
      padding: 24px;
      text-align: center;
    }
    .login-star { font-size: 36px; color: var(--green); }
    .login-title { font-family: var(--mono); font-size: 18px; color: var(--green); margin-top: 6px; }
    .login-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 4px; letter-spacing: 2px; }
    .login-body { padding: 24px; }
    .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; margin-top: 10px; }
    .demo-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      text-align: center;
    }
    .demo-role { font-family: var(--mono); font-size: 10px; color: var(--muted); }
    .demo-cred { font-family: var(--mono); font-size: 11px; color: var(--green2); margin-top: 3px; }

    .user-search-wrap { position: relative; flex: 1; min-width: 0; }
    .user-search-results {
      z-index: 50;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      overflow-y: auto;
      box-shadow: var(--shadow);
    }
    .user-search-item {
      display: block;
      width: 100%;
      text-align: right;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-family: var(--sans);
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .user-search-item:hover,
    .user-search-item.active {
      background: var(--bg4);
      color: var(--green);
    }
    .user-search-item small {
      display: block;

    .ex-matrix-tier-toggle {

      color: var(--text2);

    }

    .ex-matrix-person { text-align: center; padding: 4px 2px; }
    .ex-matrix-person-name { font-weight: bold; font-size: 12px; line-height: 1.3; }
    .ex-matrix-person-phone { font-size: 10px; color: var(--muted); margin-top: 3px; direction: ltr; }

    /* ── TABS — ניגודיות גבוהה על רקע התמונה ── */
    .spa-tabs-bar.tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: stretch;
      background: rgba(255, 255, 255, 0.94) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border2);
      border-bottom: 2px solid var(--border2);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 8px 10px 0;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: var(--shadow);
    }
    .spa-tabs-bar .tab-link {
      padding: 10px 16px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text) !important;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.88) !important;
      border: 1px solid var(--border) !important;
      border-bottom: none !important;
      border-radius: 6px 6px 0 0;
      margin-bottom: -1px;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .spa-tabs-bar .tab-link:hover {
      color: var(--green3) !important;
      background: #fff !important;
      border-color: var(--green2) !important;
    }
    .spa-tabs-bar .tab-link.active {
      color: var(--green3) !important;
      background: var(--green-dim) !important;
      border-color: var(--green) !important;
      border-bottom: 2px solid var(--green-dim) !important;
      font-weight: 700;
      box-shadow: 0 -1px 0 var(--green);
    }
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border2);
      margin-bottom: 14px;
      overflow-x: auto;
    }
    .tab-link {
      padding: 8px 16px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 6px 6px 0 0;
    }
    .tab-link:hover { color: var(--green3); background: #fff; }
    .tab-link.active {
      color: var(--green3);
      border-bottom-color: var(--green);
      background: var(--green-dim);
      font-weight: 700;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {

  .grid-2,
  .grid-3 {
    grid-template-columns: 1fr;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .page {
    padding: 10px 12px;
    overflow-x: hidden;
  }

  .page-dashboard {
    overflow-x: visible;
  }

  .dashboard-search-row {
    flex-direction: column;
  }

  .dashboard-search-btn {
    width: 100%;
  }

  .topbar {
    padding: 0 8px;
  }

  .topbar-brand .sub {
    display: none;
  }

  .topbar-nav {
    gap: 3px;
    flex-wrap: wrap;
  }

  .tabs {
    overflow-x: auto;
    overflow-y: hidden;
  }

  .tbl {
    display: block;
    overflow-x: auto;
    width: 100%;
  }

  .form-inline {
    flex-direction: column;
    align-items: stretch;
  }

  .assigned-chip {
    max-width: 100%;
    white-space: normal;
  }

  .card,
  .card-body,
  .card-header,
  .ex-row,
  .section-header {
    max-width: 100%;
    overflow-x: hidden;
  }
}

    /* ── SCANLINE effect on topbar ── */
    .topbar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.04) 2px, rgba(255,255,255,0.04) 4px);
      pointer-events: none;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }


    /* ── ASSIGNMENTS PAGE ── */
    .user-chip {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 6px;
      cursor: grab;
      transition: border-color 0.15s, box-shadow 0.15s;
      line-height: 1.4;
    }
    .user-chip:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(30, 60, 40, 0.12); }
    .user-chip:active { cursor: grabbing; }

    .ex-drop-col {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .ex-drop-col.drag-over {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(74,222,128,0.15);
    }
    .ex-drop-header {
      background: var(--bg4);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .ex-drop-body {
      padding: 8px;
      min-height: 48px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-content: flex-start;
    }
    .ex-drop-body:empty::after {
      content: 'גרור חייל לכאן...';
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px;
      width: 100%;
      text-align: center;
    }
    .assigned-chip {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 4px 6px 4px 8px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      line-height: 1.3;
    }
    .assigned-chip span { display: block; }
    .chip-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }
    .chip-remove:hover { color: var(--danger); }
    /* ── DATE PICKER ── */
    .dp-wrap { position: relative; }
    .dp-trigger {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border2); border-radius: var(--radius);
      padding: 7px 10px; font-family: var(--body); font-size: 13px;
      cursor: pointer; text-align: right; display: flex;
      align-items: center; justify-content: space-between; gap: 8px;
      transition: border-color 0.15s;
    }
    .dp-trigger:hover, .dp-trigger.open { border-color: var(--green); }
    .dp-trigger .dp-icon { color: var(--green2); font-size: 15px; flex-shrink: 0; }
    .dp-trigger .dp-val { flex: 1; }
    .dp-trigger .dp-placeholder { color: var(--muted); }
    .dp-popup {
      display: none; position: fixed;
      z-index: 9999; background: var(--bg2); border: 1px solid var(--border2);
      border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 272px; padding: 12px;
    }
    .dp-popup.open { display: block; }
    .dp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .dp-nav {
      background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
      border-radius: var(--radius); padding: 3px 8px; cursor: pointer; font-size: 14px; line-height: 1;
    }
    .dp-nav:hover { border-color: var(--green); color: var(--green); }
    .dp-month-label { font-family: var(--mono); font-size: 13px; color: var(--green); font-weight: bold; cursor: pointer; }
    .dp-month-label:hover { color: var(--green2); }
    .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .dp-dow { font-family: var(--mono); font-size: 10px; color: var(--muted); padding: 3px 0; }
    .dp-day {
      font-size: 12px; padding: 5px 2px; border-radius: 4px; cursor: pointer;
      color: var(--text); border: 1px solid transparent; line-height: 1;
    }
    .dp-day:hover { background: var(--bg4); border-color: var(--border2); }
    .dp-day.today { border-color: var(--green-dim); color: var(--green2); }
    .dp-day.selected { background: var(--green3); color: #fff; border-color: var(--green2); }
    .dp-day.other-month { color: var(--muted); }
    .dp-day.empty { cursor: default; pointer-events: none; }
    .dp-year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .dp-year-btn {
      font-family: var(--mono); font-size: 11px; padding: 5px; border-radius: 4px;
      cursor: pointer; text-align: center; color: var(--text2); border: 1px solid transparent;
    }
    .dp-year-btn:hover { background: var(--bg4); border-color: var(--border2); }
    .dp-year-btn.selected { background: var(--green3); color: #fff; border-color: var(--green2); }

    /* ── TIMELINE WEEK / EDIT ── */
    .timeline-scroll {
      overflow: auto;
      max-height: 78vh;
      min-height: 320px;
      direction: rtl;
      -webkit-overflow-scrolling: touch;
      scrollbar-gutter: stable;
      background: var(--bg2);
    }
    .timeline-track {
      direction: rtl;
      background: var(--bg2);
    }
    .timeline-track .tl-bar {
      height: calc(var(--tl-bar-min-h, 48px));
      min-height: calc(var(--tl-bar-min-h, 48px));
      box-shadow: 0 1px 4px rgba(30, 60, 40, 0.12);
    }
    .timeline-track .tl-bar-link {
      cursor: pointer;
      color: inherit;
      text-decoration: none;
    }
    .timeline-track .tl-bar-link:hover {
      filter: brightness(0.97);
    }
    .timeline-track .tl-bar-label {
      flex: 1;
      min-width: 0;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
      font-size: 11px;
      font-weight: bold;
      line-height: 1.3;
      text-align: center;
      padding: 2px 6px;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.65);
    }
    .timeline-day-slots span {
      border-left: 1px solid var(--border2);
    }
    .timeline-day-slots span:last-child {
      border-left: none;
    }
    .timeline-slot-time-label {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      text-align: center;
      padding: 0 2px;
      background: var(--glass);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 2px;
    }
    .timeline-slot-time-label.is-day-boundary {
      color: var(--text2);
      font-weight: 700;
    }
    .timeline-row-label {
      font-weight: bold;
      letter-spacing: 0.02em;
    }
    .timeline-track.edit-mode .tl-bar {
      touch-action: none;
      cursor: grab;
      box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.35);
    }
    .timeline-track.edit-mode .tl-bar:active { cursor: grabbing; }
    .timeline-track.edit-mode .tl-bar-link { pointer-events: none; }
    .timeline-track.edit-mode .tl-handle {
      display: block;
      position: absolute;
      top: 2px;
      bottom: 2px;
      width: 10px;
      min-width: 10px;
      cursor: ew-resize;
      flex-shrink: 0;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(34, 197, 94, 0.45);
      z-index: 3;
    }
    .timeline-track.edit-mode .tl-handle-start {
      right: 2px;
      left: auto;
    }
    .timeline-track.edit-mode .tl-handle-end {
      left: 2px;
      right: auto;
    }
    .timeline-track.edit-mode .tl-handle:hover {
      background: rgba(74, 222, 128, 0.55);
    }
    .timeline-track:not(.edit-mode) .tl-handle { display: none !important; }
    .timeline-track.edit-mode .tl-bar-label {
      padding-inline: 14px;
    }
    .tl-bar.tl-saving { opacity: 0.6; pointer-events: none; }
    .tl-bar.is-dragging {
      z-index: 200 !important;
      box-shadow: 0 0 0 2px var(--green), 0 4px 12px rgba(30, 60, 40, 0.15);
    }
    .timeline-track.edit-mode .tl-bar-label { pointer-events: none; user-select: none; }
    .timeline-track.edit-mode .tl-procedure-bar { pointer-events: none; }
    #timelineEditToggle.active {
      border-color: var(--green);
      color: var(--green);
      background: rgba(74, 222, 128, 0.1);
    }
    .timeline-range-seg {

      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
    }
    .timeline-range-btn {
      border: none;
      background: transparent;
      color: var(--text);
      font-weight: 600;
      border-radius: 999px;
      padding: 5px 10px;

      cursor: pointer;
      text-decoration: none;
      font-family: var(--mono);
      line-height: 1.2;
    }

      background: rgba(74, 222, 128, 0.12);
      color: var(--green);
    }

      background: #166534;
      color: #fff !important;
    }
    .spa-module-skeleton {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      padding: 16px;
      border: 1px dashed var(--border2);
      border-radius: 10px;
      background: var(--bg3);
    }
    .timeline-page-row {
      display: flex;
      flex-direction: row-reverse;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .timeline-main-col {
      flex: 1;
      min-width: 0;
    }
    .timeline-tools-panel {
      width: 290px;
      flex-shrink: 0;
      position: relative;
      transition: width 0.2s ease;
    }
    .timeline-tools-panel.is-minimized {
      width: 46px;
    }
    .timeline-tools-expand {
      display: none;
      width: 46px;
      min-height: 120px;
      padding: 10px 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg2);
      color: var(--text2);
      cursor: pointer;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 18px;
    }
    .timeline-tools-expand-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .timeline-tools-panel.is-minimized .timeline-tools-expand {
      display: flex;
    }
    .timeline-tools-panel.is-minimized .timeline-tools-body {
      display: none;
    }
    .timeline-tools-body {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 160px);
    }
    .timeline-tools-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: bold;
      color: var(--text2);
    }
    .timeline-side-tabs {
      display: flex;
      gap: 4px;
      padding: 6px 6px 0;
      border-bottom: 2px solid var(--border2);
      background: rgba(255, 255, 255, 0.94) !important;
    }
    .timeline-side-tab {
      flex: 1;
      padding: 9px 6px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: rgba(255, 255, 255, 0.8) !important;
      color: var(--text);
      cursor: pointer;
      margin-bottom: -2px;
    }
    .timeline-side-tab:hover {
      color: var(--green3);
      border-color: var(--green2);
      background: #fff !important;
    }
    .timeline-side-tab.active {
      color: var(--green3);
      border-color: var(--green);
      border-bottom: 2px solid var(--green-dim);
      background: var(--green-dim) !important;
      box-shadow: 0 -1px 0 var(--green);
    }
    .timeline-side-panel-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }
    .timeline-block-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .timeline-block-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      padding: 8px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 11px;
    }
    .timeline-block-item-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .timeline-block-item-text span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }
    .timeline-forces-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: min(52vh, 420px);
      overflow-y: auto;
    }
    .timeline-forces-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 11px;
    }
    .timeline-forces-name {
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
      line-height: 1.35;
      word-break: break-word;
    }
    .timeline-forces-name:hover {
      text-decoration: underline;
    }
    .timeline-forces-meta {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.35;
    }
    .timeline-track .tl-slot-bar {
      pointer-events: none;
    }
    .timeline-track:not(.show-procedures) .tl-procedure-bar {
      display: none;
    }
    .timeline-track .tl-procedure-bar {
      background: rgba(245, 158, 11, 0.55);
      border: 1px solid #d97706;
      border-radius: 4px;
      overflow: hidden;
      pointer-events: auto;
      cursor: help;
      box-shadow: 0 1px 3px rgba(120, 53, 15, 0.2);
    }
    .timeline-track .tl-procedure-label {
      display: block;
      font-size: 8px;
      font-weight: 700;
      line-height: 1.1;
      padding: 0 3px;
      color: #78350f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    #timelineProcedureToggle.active {
      border-color: #d97706;
      color: #b45309;
      background: rgba(245, 158, 11, 0.12);
    }
    @media (max-width: 900px) {
      .timeline-page-row {
        flex-direction: column;
      }
      .timeline-tools-panel,
      .timeline-tools-panel.is-minimized {
        width: 100%;
      }
      .timeline-tools-panel.is-minimized .timeline-tools-expand {
        width: 100%;
        min-height: auto;
        flex-direction: row;
        padding: 10px 14px;
      }
      .timeline-tools-expand-label {
        writing-mode: horizontal-tb;
      }
    }

    /* ── ASSIGNMENTS PAGE ── */
    .user-chip {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 10px;
      margin-bottom: 5px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: grab;
      user-select: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .user-chip:hover {
      border-color: var(--border2);
      box-shadow: 0 2px 8px rgba(30, 60, 40, 0.12);
    }
    .user-chip:active { cursor: grabbing; }

    .ex-drop-col {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .ex-drop-col.drag-over {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(74,222,128,0.15);
    }
    .ex-drop-header {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .ex-drop-body {
      min-height: 60px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .ex-drop-body:empty::after {
      content: '// גרור לכאן';
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      padding: 8px;
    }

    .assigned-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg4);
      border: 1px solid var(--border2);
      border-radius: 99px;
      padding: 3px 6px 3px 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .assigned-chip > span:first-child { font-weight: 600; }
    .chip-remove {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 0 2px;
      line-height: 1;
      border-radius: 50%;
      transition: color 0.1s;
    }
    .chip-remove:hover { color: var(--danger); }
  
    /* ── UNIFIED BRAND LOADER ── */
    .mapim-brand-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px;
      text-align: center;
    }
    .mapim-brand-loader-stage {
      position: relative;
      width: min(280px, 72vw);
      height: min(280px, 72vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mapim-brand-loader-orbit {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--green2);
      border-right-color: rgba(22, 163, 74, 0.35);
      animation: mapim-orbit-spin 1.4s linear infinite;
      box-shadow: 0 0 24px rgba(22, 163, 74, 0.18);
    }
    .mapim-brand-loader-orbit--outer {
      inset: -10px;
      border-top-color: var(--green);
      border-left-color: rgba(21, 128, 61, 0.4);
      animation-duration: 2.4s;
      animation-direction: reverse;
      opacity: 0.85;
    }
    .mapim-brand-loader-orbit--inner {
      inset: 18px;
      border-width: 1.5px;
      border-bottom-color: var(--green2);
      border-top-color: transparent;
      animation-duration: 1s;
    }
    .mapim-brand-loader-glow {
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(187, 247, 208, 0.55) 0%, rgba(187, 247, 208, 0) 70%);
      animation: mapim-glow-breathe 2.2s ease-in-out infinite;
      pointer-events: none;
    }
    .mapim-brand-loader-scan {
      position: absolute;
      left: 12%;
      right: 12%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green2), transparent);
      box-shadow: 0 0 12px rgba(22, 163, 74, 0.7);
      animation: mapim-scan-sweep 2.1s ease-in-out infinite;
      z-index: 2;
      pointer-events: none;
    }
    .mapim-brand-loader-logo {
      position: relative;
      z-index: 1;
      width: 72%;
      height: 72%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(124, 184, 150, 0.35);
      animation: mapim-logo-float 2.6s ease-in-out infinite;
    }
    .mapim-brand-loader-dots {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    .mapim-brand-loader-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green2);
      animation: mapim-dot-wave 1.15s ease-in-out infinite;
    }
    .mapim-brand-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
    .mapim-brand-loader-dots span:nth-child(3) { animation-delay: 0.3s; }
    .mapim-brand-loader-dots span:nth-child(4) { animation-delay: 0.45s; }
    .mapim-brand-loader-text {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.14em;
      animation: mapim-text-flicker 1.6s ease-in-out infinite;
      min-height: 1.2em;
    }
    .mapim-brand-loader--compact .mapim-brand-loader-stage {
      width: min(200px, 58vw);
      height: min(200px, 58vw);
    }
    .mapim-brand-loader--inline {
      min-height: 42vh;
      width: 100%;
    }
    @keyframes mapim-orbit-spin { to { transform: rotate(360deg); } }
    @keyframes mapim-glow-breathe {
      0%, 100% { opacity: 0.45; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.06); }
    }
    @keyframes mapim-scan-sweep {
      0% { top: 18%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 78%; opacity: 0; }
    }
    @keyframes mapim-logo-float {
      0%, 100% { transform: translateY(0) scale(1); filter: brightness(1); }
      50% { transform: translateY(-6px) scale(1.02); filter: brightness(1.06); }
    }
    @keyframes mapim-dot-wave {
      0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.35; }
      40% { transform: translateY(-9px) scale(1.15); opacity: 1; }
    }
    @keyframes mapim-text-flicker {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ── PAGE LOADER (full screen) ── */
    #page-loader {
      position:fixed;inset:0;z-index:9999;
      background:var(--overlay-dim);backdrop-filter:blur(3px);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      opacity:0;pointer-events:none;transition:opacity .2s ease;
    }
    #page-loader.visible{opacity:1;pointer-events:all;}

    /* ── APP SPLASH (initial load) — same brand loader ── */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: var(--overlay-dim);
      backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #app-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .page-local-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50vh;
    }

    /* ── STATISTICS PAGE ── */
    .stats-page { display: flex; flex-direction: column; gap: 16px; }
    .stats-section { margin-bottom: 4px; }
    .stats-section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; gap: 8px;
    }
    .stats-section-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--heading-on-bg);
      text-shadow: var(--heading-on-bg-shadow);
    }
    .stats-cohort-badge {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    }
    .stats-badge-mp { background: #dbeafe; color: #1d4ed8; }
    .stats-badge-magad { background: #ede9fe; color: #6d28d9; }
    .stats-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    .stats-kpi {
      border-radius: 14px;
      padding: 14px 12px;
      border: 1px solid;
      min-height: 92px;
    }
    .stats-kpi-label { font-size: 12px; font-weight: 600; margin-bottom: 8px; opacity: 0.85; }
    .stats-kpi-value { font-size: 30px; font-weight: 800; line-height: 1; }
    .stats-kpi-sub { font-size: 11px; margin-top: 8px; opacity: 0.75; }
    .stats-kpi-blue { background: #eef2ff; border-color: #c7d2fe; color: #1e3a8a; }
    .stats-kpi-green { background: #ecfdf5; border-color: #a7f3d0; color: #166534; }
    .stats-kpi-yellow { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .stats-kpi-cyan { background: #ecfeff; border-color: #a5f3fc; color: #155e75; }
    .stats-kpi-pink { background: #fdf2f8; border-color: #fbcfe8; color: #9d174d; }
    .stats-card { overflow: hidden; }
    .stats-card-header {
      flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    }
    .stats-chart-body { display: flex; flex-direction: column; gap: 14px; }
    .stats-chart-wrap { position: relative; height: 280px; width: 100%; }
    .stats-chart-wrap-md { height: 300px; }
    .stats-chart-wrap-pie { height: 320px; max-width: 420px; margin: 0 auto; }
    .stats-table-wrap { overflow-x: auto; }
    .stats-tbl th, .stats-tbl td { font-size: 12px; white-space: nowrap; }
    .stats-num-green { color: #16a34a; font-weight: 700; }
    .stats-num-blue { color: #4f46e5; font-weight: 700; }
    .stats-num-orange { color: #d97706; font-weight: 700; }
    .stats-seg-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .stats-seg {
      border: 1px solid var(--border2);
      background: rgba(255, 255, 255, 0.92) !important;
      color: var(--text);
      font-weight: 600;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
    }
    .stats-seg.active {
      background: #166534;
      border-color: #166534;
      color: #fff !important;
    }
    .stats-seg-sm .stats-seg { padding: 5px 10px; font-size: 10px; }
    .stats-hint, .stats-chart-caption, .stats-avg-line {
      font-size: 12px; color: var(--muted); margin: 0 0 10px;
    }
    .stats-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .stats-chip {
      border: 1px solid var(--border2);
      background: var(--glass);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
    }
    .stats-chip.active { background: #166534; border-color: #166534; color: #fff !important; }
    .stats-chip-clear { background: transparent; }
    .stats-filters {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 12px;
    }
    .stats-filter-label { font-size: 11px; color: var(--muted); }
    .stats-team-select { width: auto; min-width: 120px; font-size: 12px; }
    .stats-rank-badge {
      display: inline-block; background: #dbeafe; color: #1d4ed8;
      border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 700;
    }
    .stats-ex-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 28px; height: 28px; border-radius: 999px; font-weight: 700; font-size: 12px;
    }
    .stats-ex-count.above { background: #fce7f3; color: #be185d; }
    .stats-ex-count.below { background: #fef9c3; color: #a16207; }
    .stats-ex-count.avg { background: #dcfce7; color: #166534; }
    .stats-legend {
      display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px;
      font-size: 11px; color: var(--muted);
    }
    .stats-legend .dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-left: 6px; vertical-align: middle;
    }
    .stats-legend .dot.above { background: #f472b6; }
    .stats-legend .dot.below { background: #facc15; }
    .stats-legend .dot.avg { background: #4ade80; }

    /* ── GLASS UI — background image visible everywhere ── */
    .page,
    .page-dashboard,
    .stats-page,
    .timeline-main-col,
    .timeline-page-row,
    .team-matrix-page,
    .ex-matrix-page {
      background: transparent !important;
    }
    .card-header,
    .login-head,
    .app-drawer,
    .app-drawer-panels .card,
    .timeline-tools-body,
    .timeline-tools-panel,
    .stat-box,
    .collapsible-toggle,
    .collapsible-body,
    .dashboard-tabs,
    .team-matrix-stats,
    .ex-matrix-cell-editor,
    .user-search-results,
    .dp-popup,
    .form-input,
    .form-select,
    textarea.form-input,
    .tbl th,
    .tbl td,
    .ex-row,
    .demo-item,
    .timeline-scroll,
    .timeline-track,
    .timeline-day-head,
    .spa-module-skeleton {
      background-color: var(--glass) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .timeline-track .tl-bar,
    .timeline-track .tl-slot-bar,
    .timeline-track .tl-procedure-bar {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .stats-kpi,
    .stats-kpi-blue,
    .stats-kpi-green,
    .stats-kpi-yellow,
    .stats-kpi-cyan,
    .stats-kpi-pink,
    .stats-seg,
    .stats-chip,
    .stats-rank-badge,
    .stats-ex-count {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .stats-tbl th,
    .stats-tbl td {
      background-color: rgba(255, 255, 255, 0.55) !important;
    }
    /* טאבים — לא לדרוס ברקע זכוכית שקוף */
    .spa-tabs-bar.tabs,
    .spa-tabs-bar .tab-link,
    .timeline-side-tabs,
    .timeline-side-tab,
    .team-matrix-tabs,
    .team-matrix-tab,
    .stats-seg-tabs .stats-seg {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .tbl tr:hover td {
      background-color: var(--bg4) !important;
    }
    .stats-tbl tr:hover td {
      background-color: rgba(255, 255, 255, 0.72) !important;
    }
    .app-drawer-overlay {
      background: var(--scrim) !important;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg3);
    }
    /* פאנלים מתקפלים (הסבר סדרה / שיבוץ) — ניגודיות מעל זכוכית גלובלית */
    .expandable-panel-body {
      background: var(--glass-heavy) !important;
      color: var(--text) !important;
    }
    .expandable-stack .collapsible-toggle,
    .expandable-stack .expandable-closed {
      background: var(--glass-heavy) !important;
      color: var(--green3) !important;
    }
    .expandable-panel-body .tbl th {
      background: var(--bg4) !important;
      color: var(--green3) !important;
    }
    .expandable-panel-body .tbl td {
      background: rgba(255, 255, 255, 0.92) !important;
      color: var(--text) !important;
    }
    .expandable-panel-body .rules-muted,
    .expandable-panel-body p,
    .expandable-panel-body li {
      color: var(--text) !important;
    }
    .expandable-panel-body .rules-warn {
      color: #92400e !important;
      background: rgba(254, 243, 199, 0.85) !important;
    }
</style>
</head>
<body>

<div id="page-loader">
  <div class="mapim-brand-loader" data-mapim-brand-loader>
    <div class="mapim-brand-loader-stage">
      <div class="mapim-brand-loader-orbit mapim-brand-loader-orbit--outer" aria-hidden="true"></div>
      <div class="mapim-brand-loader-orbit" aria-hidden="true"></div>
      <div class="mapim-brand-loader-orbit mapim-brand-loader-orbit--inner" aria-hidden="true"></div>
      <div class="mapim-brand-loader-glow" aria-hidden="true"></div>
      <div class="mapim-brand-loader-scan" aria-hidden="true"></div>
      <img
        class="mapim-brand-loader-logo"
        src="https://upload.wikimedia.org/wikipedia/commons/7/72/%D7%A7%D7%95%D7%A8%D7%A1_%D7%9E%22%D7%A4.jpg"
        alt="קורס מייפים"
        width="220"
        height="220"
        decoding="async">
    </div>
    <div class="mapim-brand-loader-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
