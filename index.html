  <button type="button" id="appFloatForward" class="app-float-nav-btn" data-spa-forward hidden title="לעמוד הבא">לעמוד הבא →</button>
</div>

<script>
  // ══ Page loader (shared by SPA + assign board) ══
  var MapimLoader = (function() {
    var MAPIM_LOGO_URL = 'https://upload.wikimedia.org/wikipedia/commons/7/72/%D7%A7%D7%95%D7%A8%D7%A1_%D7%9E%22%D7%A4.jpg';
    function brandMarkup(textId, msg, extraClass) {
      var cls = 'mapim-brand-loader' + (extraClass ? ' ' + extraClass : '');
      var label = msg || '// LOADING...';
      var idAttr = textId ? (' id="' + textId + '"') : '';
      return '<div class="' + cls + '" data-mapim-brand-loader>' +
        '<div class="mapim-brand-loader-stage">' +
        '<div class="mapim-brand-loader-orbit mapim-brand-loader-orbit--outer" aria-hidden="true"></div>' +
        '<div class="mapim-brand-loader-orbit" aria-hidden="true"></div>' +
        '<div class="mapim-brand-loader-orbit mapim-brand-loader-orbit--inner" aria-hidden="true"></div>' +
        '<div class="mapim-brand-loader-glow" aria-hidden="true"></div>' +
        '<div class="mapim-brand-loader-scan" aria-hidden="true"></div>' +
        '<img class="mapim-brand-loader-logo" src="' + MAPIM_LOGO_URL + '" alt="קורס מייפים" width="220" height="220" decoding="async">' +
        '</div>' +
        '<div class="mapim-brand-loader-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>' +
        '<div class="mapim-brand-loader-text"' + idAttr + '>' + label + '</div></div>';
    }
    var loader = document.getElementById('page-loader');
    var splash = document.getElementById('app-splash');
    var ltxt = document.getElementById('loader-text');
    var splashTxt = document.getElementById('splash-text');
    var msgTimer = null;
    var safetyTimer = null;
    var splashDone = false;
    var splashStart = Date.now();
    var SPLASH_MIN_MS = 700;
    var MSGS = ['// LOADING...', '// FETCHING DATA...', '// RENDERING...', '// ALMOST THERE...'];
    var LABELS = {
      'action=login': '// AUTHENTICATING...',
      'action=verifyMfa': '// VERIFYING CODE...',
      'action=resendMfa': '// RESENDING CODE...',
      'action=logout': '// SIGNING OUT...',
      'action=delete': '// DELETING...',
      'action=create': '// CREATING...',
      'action=edit': '// SAVING...',
      'action=assign': '// ASSIGNING...',
      'action=remove': '// REMOVING...',
      'action=complete': '// UPDATING...',
      'action=autoAssignAll': '// AUTO-ASSIGNING...',
      'action=clearAllAssignments': '// CLEARING...',
      'action=deleteArchivedSeries': '// DELETING SERIES...',
      'action=importUsers': '// IMPORTING...',
      'page=dashboard': '// LOADING DASHBOARD...',
      'page=exercise': '// LOADING EXERCISE...',
      'page=timeline': '// LOADING TIMELINE...',
      'page=assign': '// LOADING BOARD...',
      'page=user': '// LOADING PROFILE...',
      'page=users': '// LOADING USERS...',
      'page=exercises': '// LOADING EXERCISES...',
      'page=seriesArchive': '// LOADING ARCHIVE...',
      'page=fieldForces': '// LOADING FIELD FORCES...',
      'page=fieldForce': '// LOADING...',
      'page=fireZones': '// LOADING FIRE ZONES...',
      'page=fireZone': '// LOADING...',
      'page=teamMatrix': '// LOADING TEAM VIEW...',
      'page=exerciseMatrix': '// LOADING EXERCISE VIEW...',
      'page=statistics': '// LOADING STATISTICS...',
      'page=feedback': '// LOADING FEEDBACK...'
    };
    function labelFor(key) {
      if (!key) return MSGS[0];
      for (var k in LABELS) { if (key.indexOf(k) > -1) return LABELS[k]; }
      return MSGS[0];
    }
    function setStatusText(text) {
      if (ltxt) ltxt.textContent = text;
      if (splashTxt) splashTxt.textContent = text;
    }
    function showSplashStatus(msg) {
      clearTimeout(safetyTimer);
      setStatusText(msg || MSGS[0]);
    }
    function hideSplash() {
      if (!splash || splashDone) return;
      splashDone = true;
      var wait = Math.max(0, SPLASH_MIN_MS - (Date.now() - splashStart));
      setTimeout(function() {
        splash.classList.add('is-hidden');
        setTimeout(function() {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 420);
      }, wait);
    }
    function show(msg) {
      if (!loader) return;
      clearInterval(msgTimer);
      clearTimeout(safetyTimer);
      loader.classList.add('visible');
      var text = msg || MSGS[0];
      setStatusText(text);
      var i = 0;
      msgTimer = setInterval(function() {
        i = (i + 1) % MSGS.length;
        setStatusText(MSGS[i]);
      }, 900);
      safetyTimer = setTimeout(hide, 20000);
    }
    /** טעינת דשבורד בכניסה — בלי הסתרה אוטומטית אחרי 20ש */
    function showPersistent(msg) {
      if (!loader) return;
      clearInterval(msgTimer);
      clearTimeout(safetyTimer);
      loader.classList.add('visible');
      setStatusText(msg || MSGS[0]);
      if (splashTxt && splash && !splashDone) splashTxt.textContent = msg || MSGS[0];
      msgTimer = null;
      safetyTimer = null;
    }
    function hide() {
      if (!loader) return;
      clearInterval(msgTimer);
      clearTimeout(safetyTimer);
      loader.classList.remove('visible');
    }
    return {
      show: show,
      showPersistent: showPersistent,
      hide: hide,
      hideSplash: hideSplash,
      showSplashStatus: showSplashStatus,
      labelFor: labelFor,
      brandMarkup: brandMarkup,
      MSGS: MSGS
    };
  })();
  window.MapimSpaShowLoader = function(msg) { MapimLoader.show(msg); };
  window.MapimSpaHideLoader = function() { MapimLoader.hide(); };

  // ══ Lazy module slots (with client cache after priming) ══
  var MapimModules = (function() {
    var moduleCache = {};
    var moduleEpoch = 0;

    function moduleKey(moduleId, params) {
      return String(moduleId || '') + '::' + JSON.stringify(params || {});
    }

    function invalidate() {
      moduleCache = {};
      moduleEpoch++;
    }

    function store(moduleId, params, html) {
      if (!moduleId || html == null) return;
      moduleCache[moduleKey(moduleId, params)] = { html: html, epoch: moduleEpoch };
    }

    function get(moduleId, params) {
      var hit = moduleCache[moduleKey(moduleId, params)];
      if (!hit || hit.epoch !== moduleEpoch) return null;
      return hit.html;
    }

    function fillSlot(slot, html) {
      slot.innerHTML = html;
      if (window.MapimSpa) {
        if (MapimSpa.runScripts) MapimSpa.runScripts(slot);
        if (MapimSpa.afterRender) MapimSpa.afterRender();
      }
      slot.setAttribute('data-spa-module-loaded', '1');
    }

    function loadSlot(slot) {
      if (!slot || slot.getAttribute('data-spa-module-loaded') === '1') return;
      var moduleId = slot.getAttribute('data-spa-module');
      if (!moduleId) return;
      var params = window.MapimSpa && MapimSpa.parseSpaParams
        ? MapimSpa.parseSpaParams(slot) : {};
      var cached = get(moduleId, params);
      if (cached != null) {
        fillSlot(slot, cached);
        return;
      }
      slot.setAttribute('data-spa-module-loaded', 'pending');
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || res.html == null) {
            slot.innerHTML = '<div class="flash flash-error">⚠ ' +
              (res && res.error ? res.error : 'שגיאת טעינת מודול') + '</div>';
            slot.setAttribute('data-spa-module-loaded', '1');
          } else {
            store(moduleId, params, res.html);
            fillSlot(slot, res.html);
          }
        })
        .withFailureHandler(function(err) {
          slot.innerHTML = '<div class="flash flash-error">⚠ ' +
            (err && err.message ? err.message : String(err)) + '</div>';
          slot.setAttribute('data-spa-module-loaded', '1');
        })
        .apiLoadModule(window.MapimSpa ? MapimSpa.getSid() : '', moduleId, JSON.stringify(params || {}));
    }
    function load(root) {
      root = root || document.getElementById('app-content');
      if (!root) return;
      root.querySelectorAll('[data-spa-module]:not([data-spa-module-loaded="1"])').forEach(function(slot) {
        if (slot.closest('.lazy-tab-panel[hidden]')) return;
        var coll = slot.closest('.collapsible-content');
        if (coll && !coll.classList.contains('open')) return;
        loadSlot(slot);
      });
    }
    return { load: load, loadSlot: loadSlot, store: store, invalidate: invalidate };
  })();

  // ══ SPA router — fixed URL, no full page reloads ══
  var MapimSpa = (function() {
    var SID_KEY = 'mapim_sid';
    var MFA_KEY = 'mapim_mfa_token';
    var loading = false;
    var reqId = 0;
    var initialBoot = true;
    var splashBoot = true;
    var currentRoute = null;
    var navStack = [];
    var forwardStack = [];

    function cloneRoute(route) {
      if (!route) return null;
      return { page: route.page, params: Object.assign({}, route.params || {}) };
    }

    function routeKey(route) {
      if (!route) return '';
      return route.page + '::' + JSON.stringify(route.params || {});
    }

    function canGoBack() {
      if (navStack.length) return true;
      if (!currentRoute) return false;
      var pg = currentRoute.page;
      return pg !== 'dashboard' && pg !== 'login';
    }

    function canGoForward() {
      return forwardStack.length > 0;
    }

    function updateNavButtons() {
      var floatNav = document.getElementById('appFloatNav');
      var backFloat = document.getElementById('appFloatBack');
      var fwdFloat = document.getElementById('appFloatForward');
      var topBack = document.getElementById('appTopbarBack');
      var showBack = canGoBack();
      var showFwd = canGoForward();
      var loggedIn = !!getSid() && currentRoute && currentRoute.page !== 'login';
      if (topBack) topBack.hidden = true;
      if (floatNav) floatNav.hidden = !loggedIn || (!showBack && !showFwd);
      if (backFloat) backFloat.hidden = !showBack;
      if (fwdFloat) fwdFloat.hidden = !showFwd;
    }

    function updateBackButton() {
      updateNavButtons();
    }

    function goBack() {
      var cur = cloneRoute(currentRoute);
      if (navStack.length) {
        var prev = navStack.pop();
        if (cur && routeKey(cur) !== routeKey(prev)) forwardStack.push(cur);
        navigate(prev.page, prev.params || {}, { fromBack: true });
        return;
      }
      if (currentRoute && currentRoute.page !== 'dashboard' && getSid()) {
        if (cur) forwardStack.push(cur);
        navigate('dashboard', {}, { fromBack: true, replace: true });
      } else if (currentRoute && currentRoute.page !== 'login') {
        if (cur) forwardStack.push(cur);
        navigate('login', {}, { fromBack: true, replace: true });
      }
    }

    function goForward() {
      if (!forwardStack.length) return;
      var next = forwardStack.pop();
      var cur = cloneRoute(currentRoute);
      if (cur && routeKey(cur) !== routeKey(next)) navStack.push(cur);
      navigate(next.page, next.params || {}, { fromForward: true });
    }

    function finishBootUi() {
      MapimLoader.hide();
      if (splashBoot) {
        splashBoot = false;
        MapimLoader.hideSplash();
      }
    }

    function parseSpaParams(el) {
      var raw = el.getAttribute('data-spa-params');
      if (!raw) return {};
      try { return JSON.parse(raw); } catch (e1) {
        try {
          var t = document.createElement('textarea');
          t.innerHTML = raw;
          return JSON.parse(t.value);
        } catch (e2) { return {}; }
      }
    }

    function userLinkHtml(userId, userName) {
      var uid = String(userId || '').trim();
      var name = String(userName == null ? '' : userName);
      if (!uid) return '<b>' + String(name).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</b>';
      var params = JSON.stringify({ id: uid }).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      var safeName = String(name || uid).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return '<a href="#" class="user-name-link" data-spa-page="user" data-spa-params="' + params + '"><b>' +
        safeName + '</b></a>';
    }

    function exerciseLinkHtml(exerciseId, title) {
      var exId = String(exerciseId || '').trim();
      var name = String(title == null ? '' : title);
      if (!exId) return '<b>' + String(name).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</b>';
      var params = JSON.stringify({ id: exId }).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      var safeName = String(name || exId).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return '<a href="#" class="exercise-name-link" data-spa-page="exercise" data-spa-params="' + params + '"><b>' +
        safeName + '</b></a>';
    }

    function whatsappDigits(phone) {
      var d = String(phone || '').replace(/\D/g, '');
      if (!d) return '';
      if (d.indexOf('972') === 0) return d;
      if (d.charAt(0) === '0') return '972' + d.slice(1);
      if (d.length === 9 && d.charAt(0) === '5') return '972' + d;
      return d;
    }

    function whatsappLinkHtml(phone, label) {
      var raw = String(phone || '').trim();
      if (!raw) return '<span style="color:var(--muted)">—</span>';
      var digits = whatsappDigits(raw);
      if (!digits) {
        return String(raw).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      var text = label != null ? String(label) : raw;
      var safeText = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return '<a href="https://wa.me/' + digits + '" target="_blank" rel="noopener noreferrer" class="whatsapp-link" title="פתח צ\'אט בוואטסאפ">' +
        safeText + '</a>';
    }

    var warmPageScheduled = {};
    var pageCache = {};
    var pageCacheEpoch = 0;
    var appPrimed = false;
    var primingInProgress = false;

    function normalizeRoute(page, params) {
      page = String(page || '').trim();
      var src = params || {};
      var out = {};
      // מפתח קאש יציב לטאבי דשבורד — בלי searchUserId וכו'
      if (page === 'dashboard') {
        out.tab = String(src.tab || 'search').trim() || 'search';
      } else if (page === 'exercises') {
        out.tab = String(src.tab || 'list').trim() || 'list';
      } else if (page === 'users') {
        out.tab = String(src.tab || 'users').trim() || 'users';
      } else if (page === 'statistics') {
        out.section = String(src.section || 'kpi').trim() || 'kpi';
      } else if (page === 'exercise' || page === 'user' || page === 'fieldForce' || page === 'fireZone') {
        if (src.id != null && String(src.id).trim()) out.id = String(src.id).trim();
        if (src.archive) out.archive = String(src.archive);
      } else if (page === 'seriesArchive') {
        var seriesId = src.seriesId || src.id;
        if (seriesId != null && String(seriesId).trim()) out.seriesId = String(seriesId).trim();
      } else if (page === 'timeline') {
        if (src.week != null && String(src.week).trim() !== '') out.week = String(src.week);
        if (src.range) out.range = String(src.range);
        if (src.pos) out.pos = String(src.pos);
      } else if (page === 'feedback') {
        if (src.assignmentId) out.assignmentId = String(src.assignmentId);
        if (src.exerciseId) out.exerciseId = String(src.exerciseId);
      }
      // מצב לשונית נפתחת — מפתח קאש נפרד (למקרה של קישורים ישנים)
      if (src.open != null && String(src.open).trim()) {
        out.open = String(src.open).trim();
      }
      return { page: page, params: out };
    }

    function invalidateClientPageCache(opts) {
      opts = opts || {};
      pageCache = {};
      pageCacheEpoch++;
      if (!opts.keepPrimed) appPrimed = false;
      if (window.MapimModules && MapimModules.invalidate) MapimModules.invalidate();
    }

    /** מבטל רק נתיבים שמושפעים מכתיבה — משאיר שאר הקאש לניווט מהיר */
    function invalidateClientRoutes(pages) {
      var list = pages || [];
      Object.keys(pageCache).forEach(function(key) {
        for (var i = 0; i < list.length; i++) {
          if (key.indexOf(list[i] + '::') === 0) {
            delete pageCache[key];
            break;
          }
        }
      });
    }

    function storeClientPage(route, result) {
      if (!route || !result || result.body == null) return;
      if (result.clearSid || result.mfaToken) return;
      if (route.page === 'login') return;
      var norm = normalizeRoute(route.page, route.params);
      pageCache[routeKey(norm)] = {
        body: result.body,
        title: result.title || '',
        epoch: pageCacheEpoch
      };
    }

    function getClientPage(route) {
      if (!route || route.page === 'login') return null;
      var norm = normalizeRoute(route.page, route.params);
      var hit = pageCache[routeKey(norm)];
      if (!hit || hit.epoch !== pageCacheEpoch) return null;
      return { body: hit.body, title: hit.title };
    }

    function finishPriming(opts) {
      opts = opts || {};
      primingInProgress = false;
      appPrimed = true;
      if (!opts.background) {
        MapimLoader.hide();
        finishBootUi();
        loading = false;
      }
    }

    function storePagesList(list) {
      (list || []).forEach(function(item) {
        if (item && item.body != null) {
          storeClientPage(
            { page: item.page, params: item.params || {} },
            { body: item.body, title: item.title || '' }
          );
        }
      });
    }

    function revealDashboardFromCache() {
      var dashRoute = normalizeRoute('dashboard', { tab: 'search' });
      currentRoute = dashRoute;
      navStack = [];
      forwardStack = [];
      var dash = getClientPage(dashRoute);
      var app = document.getElementById('app-content');
      if (dash && dash.body && app) {
        app.innerHTML = dash.body;
        runScripts(app);
        afterRender();
        if (dash.title) document.title = dash.title;
        finishPriming({});
        return true;
      }
      return false;
    }

    // ── Staged load: dashboard → exercises → remaining ──
    var loadStage = {
      dashboard: false,
      exercises: false,
      remaining: false,
      running: false
    };
    var stageWaiters = { dashboard: [], exercises: [], remaining: [] };

    function gsCall(methodName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        try {
          var runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(function(err) {
              reject(err || new Error(methodName + ' failed'));
            });
          if (typeof runner[methodName] !== 'function') {
            reject(new Error('Missing server function: ' + methodName));
            return;
          }
          runner[methodName].apply(runner, args);
        } catch (e) {
          reject(e);
        }
      });
    }

    function notifyStage(stage) {
      loadStage[stage] = true;
      var waiters = stageWaiters[stage] || [];
      stageWaiters[stage] = [];
      waiters.forEach(function(fn) {
        try { fn(); } catch (e) {}
      });
    }

    function whenStageReady(stage) {
      if (loadStage[stage]) return Promise.resolve();
      return new Promise(function(resolve) {
        if (!stageWaiters[stage]) stageWaiters[stage] = [];
        stageWaiters[stage].push(resolve);
      });
    }

    function stageForPage(page) {
      page = String(page || '');
      if (page === 'login') return null;
      if (page === 'dashboard') return 'dashboard';
      if (page === 'exercises' || page === 'exercise') return 'exercises';
      return 'remaining';
    }

    function showLocalPageLoader(msg) {
      var app = document.getElementById('app-content');
      if (!app) return;
      var inner = (window.MapimLoader && MapimLoader.brandMarkup)
        ? MapimLoader.brandMarkup('', msg || '// LOADING...', 'mapim-brand-loader--compact mapim-brand-loader--inline')
        : (msg || '// LOADING...');
      app.innerHTML = '<div class="page-local-loader">' + inner + '</div>';
    }

    function storeModulesList(list) {
      (list || []).forEach(function(item) {
        if (item && item.html != null && window.MapimModules && MapimModules.store) {
          MapimModules.store(item.moduleId, item.params || {}, item.html);
        }
      });
    }

    /**
     * Staged session load:
     * 1) getDashboardData → paint dashboard, hide full-screen loader
     * 2) getExercisesData (background, no modal)
     * 3) getRemainingAppData (background, no modal)
     */
    function startStagedLoad() {
      if (!getSid()) return;
      if (loadStage.running) return;

      loadStage.running = true;
      loadStage.dashboard = false;
      loadStage.exercises = false;
      loadStage.remaining = false;
      primingInProgress = true;
      appPrimed = false;

      MapimLoader.showPersistent('// LOADING DASHBOARD...');
      MapimLoader.showSplashStatus('// LOADING DASHBOARD...');

      console.time('client:stagedLoad');
      console.time('client:getDashboardData');
      var tDashRpc = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();

      gsCall('getDashboardData', getSid())
        .catch(function() {
          return gsCall('apiReadyDashboard', getSid());
        })
        .then(function(res) {
          console.timeEnd('client:getDashboardData');
          var rpcMs = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - tDashRpc;
          if (res && res.profile) {
            console.log('[mapim profile] server getDashboardData', res.profile);
            console.log('[mapim profile] unified data', res.data || null);
          }
          console.log('[mapim profile] client RPC+transfer getDashboardData ms=', Math.round(rpcMs));

          console.time('client:paintDashboard');
          if (res && res.ok !== false) {
            storePagesList(res.pages);
            if (res.dashboard && res.dashboard.body) {
              storeClientPage(
                normalizeRoute('dashboard', { tab: 'search' }),
                { body: res.dashboard.body, title: res.dashboard.title || 'מסך הבית' }
              );
            }
          }
          if (!revealDashboardFromCache()) {
            // fallback server render
            return gsCall('apiRenderPage', getSid(), 'dashboard', JSON.stringify({ tab: 'search' }))
              .then(function(dash) {
                if (dash && dash.body) {
                  storeClientPage(normalizeRoute('dashboard', { tab: 'search' }), dash);
                  revealDashboardFromCache();
                } else {
                  finishPriming({});
                }
              });
          }
        })
        .then(function() {
          console.timeEnd('client:paintDashboard');
          notifyStage('dashboard');
          appPrimed = true;
          primingInProgress = false;
          // Step 3 — background, no full-screen loader
          console.time('client:getExercisesData');
          return gsCall('getExercisesData', getSid());
        })
        .then(function(res) {
          console.timeEnd('client:getExercisesData');
          storePagesList(res && res.pages);
          notifyStage('exercises');
          // Step 4 — remaining
          console.time('client:getRemainingAppData');
          return gsCall('getRemainingAppData', getSid());
        })
        .then(function(res) {
          console.timeEnd('client:getRemainingAppData');
          storePagesList(res && res.pages);
          if (res && res.modules && res.modules.length) {
            return gsCall('apiPrefetchModules', getSid(), JSON.stringify(res.modules))
              .then(function(modRes) {
                storeModulesList(modRes && modRes.modules);
              })
              .catch(function() {});
          }
        })
        .then(function() {
          notifyStage('remaining');
          loadStage.running = false;
          appPrimed = true;
          primingInProgress = false;
          console.timeEnd('client:stagedLoad');
        })
        .catch(function(err) {
          try { console.timeEnd('client:getDashboardData'); } catch (e1) {}
          try { console.timeEnd('client:paintDashboard'); } catch (e2) {}
          try { console.timeEnd('client:getExercisesData'); } catch (e3) {}
          try { console.timeEnd('client:getRemainingAppData'); } catch (e4) {}
          try { console.timeEnd('client:stagedLoad'); } catch (e5) {}
          console.warn('[mapim profile] stagedLoad error', err);
          loadStage.running = false;
          primingInProgress = false;
          appPrimed = true;
          notifyStage('dashboard');
          notifyStage('exercises');
          notifyStage('remaining');
          if (!document.getElementById('app-content') ||
              !document.getElementById('app-content').innerHTML) {
            revealDashboardFromCache();
            finishPriming({});
          }
          MapimLoader.hide();
          finishBootUi();
        });
    }

    /** תאימות — קריאות ישנות ל-startAppPriming */
    function startAppPriming(opts) {
      opts = opts || {};
      if (opts.background) {
        // כבר רץ בתור המדורג / אין צורך ב-reprime מלא
        return;
      }
      startStagedLoad();
    }

    function scheduleWarmPageCache(page) {
      page = String(page || '').trim();
      if (!page || warmPageScheduled[page] || !getSid()) return;
      warmPageScheduled[page] = true;
      var run = function() {
        try {
          google.script.run.apiWarmPageCache(getSid(), page);
        } catch (e) {}
      };
      if (typeof requestIdleCallback === 'function') {
        requestIdleCallback(run, { timeout: 3500 });
      } else {
        setTimeout(run, 1200);
      }
    }

    if (!document.body._timelineWarmBound) {
      document.body._timelineWarmBound = true;
      document.addEventListener('mouseenter', function(e) {
        if (!e.target || !e.target.closest) return;
        if (e.target.closest('[data-spa-page="timeline"]')) scheduleWarmPageCache('timeline');
      }, true);
    }

    function getSid() {
      try { return sessionStorage.getItem(SID_KEY) || ''; } catch (e) { return ''; }
    }
    function setSid(sid) {
      try {
        if (sid) sessionStorage.setItem(SID_KEY, sid);
        else sessionStorage.removeItem(SID_KEY);
      } catch (e) {}
    }

    function setMfaToken(token) {
      try {
        if (token) sessionStorage.setItem(MFA_KEY, token);
        else sessionStorage.removeItem(MFA_KEY);
      } catch (e) {}
    }
    function getMfaToken() {
      try { return sessionStorage.getItem(MFA_KEY) || ''; } catch (e) { return ''; }
    }

    function runScripts(container) {
      if (!container) return;
      container.querySelectorAll('script').forEach(function(old) {
        var t = (old.getAttribute('type') || '').trim().toLowerCase();
        // Keep data islands (e.g. assign board JSON) — do not execute as JS
        if (t && t !== 'text/javascript' && t !== 'application/javascript' && t !== 'module') {
          return;
        }
        var s = document.createElement('script');
        if (old.src) {
          s.src = old.src;
          s.async = false;
        } else {
          s.textContent = old.textContent;
        }
        old.parentNode.replaceChild(s, old);
      });
    }

    function initFlatpickr() {
      if (typeof flatpickr === 'undefined') return;
      document.querySelectorAll('.datepicker').forEach(function(el) {
        if (el._flatpickr) return;
        flatpickr(el, { dateFormat: 'Y-m-d', allowInput: true, disableMobile: true });
      });
    }

    function afterRender() {
      if (typeof initCollapsibles === 'function') initCollapsibles();
      if (typeof initDatePickers === 'function') initDatePickers();
      initFlatpickr();
      initAppDrawer();
      updateBackButton();
      if (typeof initTimelineWeek === 'function') initTimelineWeek();
      if (typeof initDashboardUserSearch === 'function') initDashboardUserSearch();
      if (typeof initAllExerciseCalendars === 'function') initAllExerciseCalendars();
      if (typeof initDashboardProcedurePeek === 'function') initDashboardProcedurePeek();
      if (typeof initTimeWheelPickers === 'function') initTimeWheelPickers();
      if (typeof initExerciseProcedurePanel === 'function') initExerciseProcedurePanel();
      if (typeof initExerciseEditShiftPrompt === 'function') initExerciseEditShiftPrompt();
      if (typeof initActionButtonTooltips === 'function') initActionButtonTooltips();
      var openPanel = document.querySelector('.collapsible.open[id^="panel-"]');
      if (openPanel) {
        try { openPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (x) {}
      }
    }

    function initAppDrawer() {
      var drawer = document.getElementById('appDrawer');
      var overlay = document.getElementById('appDrawerOverlay');
      var openBtn = document.getElementById('appDrawerOpen');
      var closeBtn = document.getElementById('appDrawerClose');
      if (!drawer || !overlay) return;

      function openDrawer() {
        drawer.classList.add('open');
        drawer.setAttribute('aria-hidden', 'false');
        overlay.hidden = false;
        scheduleWarmPageCache('timeline');
        requestAnimationFrame(function() {
          overlay.classList.add('open');
        });
        document.body.classList.add('drawer-open');
        var panelsSlot = document.querySelector('#appDrawerPanels [data-spa-module="drawer.panels"]');
        if (panelsSlot && window.MapimModules) MapimModules.loadSlot(panelsSlot);
      }

      function closeDrawer() {
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        overlay.classList.remove('open');
        document.body.classList.remove('drawer-open');
        setTimeout(function() {
          if (!drawer.classList.contains('open')) overlay.hidden = true;
        }, 280);
      }

      if (openBtn) {
        openBtn.onclick = function(e) {
          e.preventDefault();
          openDrawer();
        };
      }
      if (closeBtn) {
        closeBtn.onclick = function(e) {
          e.preventDefault();
          closeDrawer();
        };
      }
      overlay.onclick = closeDrawer;

      drawer.querySelectorAll('.app-drawer-link, .app-drawer-foot a').forEach(function(el) {
        el.addEventListener('click', function() {
          closeDrawer();
        });
      });

      window.MapimDrawer = { open: openDrawer, close: closeDrawer };
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && window.MapimDrawer) MapimDrawer.close();
    });

    function applyResult(result, opts) {
      opts = opts || {};
      if (!result) return;
      if (result.clearSid) {
        setSid('');
        setMfaToken('');
        navStack = [];
        forwardStack = [];
        currentRoute = { page: 'login', params: {} };
        invalidateClientPageCache();
        primingInProgress = false;
      }
      if (result.sid) {
        setSid(result.sid);
        setMfaToken('');
        if (!result.mfaToken) {
          navStack = [];
          forwardStack = [];
          currentRoute = normalizeRoute('dashboard', {});
          invalidateClientPageCache();
        }
      }
      if (result.mfaToken) setMfaToken(result.mfaToken);

      // אחרי לוגאין: לא מציגים דשבורד עד שכל נתוני/טאבי הדשבורד מוכנים
      var needsDashReady = !!(result.sid || result.deferDashboard) &&
        !result.mfaToken &&
        !!getSid() &&
        !appPrimed &&
        !loadStage.running &&
        !opts.fromClientCache &&
        !opts.skipPrime;

      if (needsDashReady) {
        loading = false;
        var appHold = document.getElementById('app-content');
        if (appHold) appHold.innerHTML = '';
        MapimLoader.showPersistent('// LOADING DASHBOARD...');
        startStagedLoad();
        return;
      }

      var app = document.getElementById('app-content');
      if (app && result.body != null) {
        app.innerHTML = result.body;
        runScripts(app);
        afterRender();
      }
      if (result.title) document.title = result.title;

      finishBootUi();
      loading = false;
      if (!opts.fromClientCache && currentRoute && result.body) storeClientPage(currentRoute, result);
      if (currentRoute && currentRoute.page === 'dashboard') scheduleWarmPageCache('timeline');
    }

    function fail(err) {
      finishBootUi();
      loading = false;
      primingInProgress = false;
      alert(err && err.message ? err.message : String(err));
    }

    function navigate(page, params, options) {
      options = options || {};
      params = params || {};
      page = String(page || 'login').trim();
      if (!options.fromBack && !options.fromForward) forwardStack = [];
      var prevRoute = currentRoute;
      var nextRoute = normalizeRoute(page, params);

      function commitNav(result, fromCache) {
        if (!options.fromBack && !options.fromForward && !options.replace && prevRoute) {
          if (routeKey(prevRoute) !== routeKey(nextRoute)) navStack.push(prevRoute);
        }
        if (options.replace) navStack = [];
        currentRoute = nextRoute;
        applyResult(result, fromCache ? { fromClientCache: true, skipPrime: true } : { skipPrime: true });
      }

      // קאש לקוח — מיידי
      if (!options.force && !options.skipCache && page !== 'login') {
        var cached = getClientPage(nextRoute);
        if (cached) {
          commitNav(cached, true);
          return;
        }
      }

      // שלב רקע עדיין רץ — ממתין עם לוודר מקומי (לא חוסם מסך מלא)
      var needed = stageForPage(page);
      if (needed && !loadStage[needed] && loadStage.running && page !== 'login' && !options.force) {
        showLocalPageLoader('// LOADING ' + page.toUpperCase() + '...');
        currentRoute = nextRoute;
        whenStageReady(needed).then(function() {
          var hit = getClientPage(nextRoute);
          if (hit) {
            commitNav(hit, true);
            return;
          }
          // עדיין אין בקאש — קריאה לשרת
          google.script.run
            .withSuccessHandler(function(result) {
              if (result && result.body) storeClientPage(nextRoute, result);
              commitNav(result || {}, false);
            })
            .withFailureHandler(function(err) { fail(err); })
            .apiRenderPage(getSid(), page, JSON.stringify(nextRoute.params || {}));
        });
        return;
      }

      var myReq = ++reqId;
      loading = true;
      var booting = initialBoot;
      if (booting) initialBoot = false;
      var loadLabel = MapimLoader.labelFor('page=' + page);
      if (booting) MapimLoader.showSplashStatus(loadLabel);
      else MapimLoader.show(loadLabel);
      google.script.run
        .withSuccessHandler(function(result) {
          if (myReq !== reqId) return;
          commitNav(result, false);
        })
        .withFailureHandler(function(err) {
          if (myReq !== reqId) return;
          fail(err);
        })
        .apiRenderPage(getSid(), page, JSON.stringify(nextRoute.params || {}));
    }

    function runAction(action, params) {
      var myReq = ++reqId;
      loading = true;
      MapimLoader.show(MapimLoader.labelFor('action=' + (action || '')));
      google.script.run
        .withSuccessHandler(function(result) {
          if (myReq !== reqId) return;
          var isAuthEntry = action === 'login' || action === 'verifyMfa';
          if (isAuthEntry) {
            invalidateClientPageCache();
            applyResult(result);
            return;
          }
          // לא מוחקים את כל הקאש — רק דפים שמושפעים + הדף הנוכחי יוחלף מ-result.body
          invalidateClientRoutes(['dashboard', 'assign', 'timeline', 'statistics', 'exerciseMatrix', 'teamMatrix']);
          if (currentRoute && currentRoute.page) {
            invalidateClientRoutes([currentRoute.page]);
          }
          applyResult(result, { skipPrime: true });
          // בלי reprime מלא אחרי כל כתיבה (זה גרם ל-3–4ש׳ לקליק הבא)
        })
        .withFailureHandler(function(err) {
          if (myReq !== reqId) return;
          fail(err);
        })
        .apiRunAction(getSid(), action, JSON.stringify(params || {}));
    }

    function formToObject(form) {
      var data = {};
      var fd = new FormData(form);
      fd.forEach(function(v, k) { data[k] = v; });
      // Include inputs linked via form="..." (participant row save)
      if (form.id) {
        document.querySelectorAll('[form="' + form.id + '"]').forEach(function(el) {
          if (!el.name || el.disabled) return;
          if (el.type === 'checkbox' || el.type === 'radio') {
            if (el.checked) data[el.name] = el.value;
            return;
          }
          data[el.name] = el.value;
        });
      }
      return data;
    }

    function loadAppBackgroundLazy() {
      var img = document.getElementById('app-bg');
      if (!img || img.getAttribute('data-bg-pending') !== '1') return;
      img.removeAttribute('data-bg-pending');
      console.time('client:getAppBgDataUri');
      try {
        google.script.run
          .withSuccessHandler(function(uri) {
            console.timeEnd('client:getAppBgDataUri');
            if (uri && img) img.src = uri;
          })
          .withFailureHandler(function() {
            try { console.timeEnd('client:getAppBgDataUri'); } catch (e0) {}
          })
          .getAppBgDataUri();
      } catch (e1) {
        try { console.timeEnd('client:getAppBgDataUri'); } catch (e2) {}
      }
    }

    function boot() {
      console.time('client:boot');
      // Background after shell paint — never block first HTML
      setTimeout(loadAppBackgroundLazy, 0);
      var sid = getSid();
      if (sid) {
        MapimLoader.showSplashStatus('// LOADING DASHBOARD...');
        MapimLoader.showPersistent('// LOADING DASHBOARD...');
        startStagedLoad();
      } else {
        MapimLoader.showSplashStatus('טוען...');
        navigate('login', {});
      }
      console.timeEnd('client:boot');
    }

    function isLocalUiClick(el) {
      // לשוניות נפתחות — מקומי, גם אם נשאר data-spa-page מקאש ישן
      if (el.closest('.collapsible-toggle') ||
          el.closest('.expandable-closed') ||
          el.closest('.ex-matrix-tier-toggle')) return true;
      if (el.closest('[data-spa-page]') || el.closest('[data-spa-action]')) return false;
      return el.closest('.dp-tab') ||
        el.closest('.dp-wrap') ||
        el.closest('.dp-popup') ||
        el.closest('#app-splash') ||
        el.closest('#page-loader') ||
        el.closest('#timelineWeekSelect') ||
        el.closest('#timelineEditToggle') ||
        el.closest('#timelineProcedureToggle') ||
        el.closest('#dashboardCalExportIcs') ||
        el.closest('#exercisesCalExportIcs') ||
        el.closest('[data-app-cal-nav]') ||
        el.closest('.dash-proc-btn') ||
        el.closest('.dash-proc-open-btn') ||
        el.closest('#proc-add-toggle') ||
        el.closest('.proc-edit-btn') ||
        el.closest('.proc-edit-cancel') ||
        el.closest('.time-wheel-wrap') ||
        el.closest('.time-wheel-popup') ||
        el.closest('.time-wheel-btn') ||
        el.closest('.tl-handle') ||
        (el.closest('.timeline-track.edit-mode .tl-bar') && !el.closest('.exercise-name-link'));
    }

    document.addEventListener('click', function(e) {
      if (e.target.closest('[data-spa-back]')) {
        e.preventDefault();
        goBack();
        return;
      }

      if (e.target.closest('[data-spa-forward]')) {
        e.preventDefault();
        goForward();
        return;
      }

      if (isLocalUiClick(e.target)) return;

      var el = e.target.closest('[data-spa-page]');
      if (el) {
        e.preventDefault();
        navigate(el.getAttribute('data-spa-page'), parseSpaParams(el));
        return;
      }
      el = e.target.closest('[data-spa-action]');
      if (el && !el.dataset.confirm) {
        e.preventDefault();
        runAction(el.getAttribute('data-spa-action'), parseSpaParams(el));
        return;
      }
      if (e.target.closest('.spa-form button[type="submit"], .spa-form input[type="submit"], button[type="submit"][form]')) {
        MapimLoader.show('// SAVING...');
      }
      if (e.target.id === 'xlsxImportBtn' || e.target.closest('#xlsxImportBtn')) {
        MapimLoader.show('// IMPORTING...');
      }
    }, true);

    document.addEventListener('submit', function(e) {
      var form = e.target;
      if (!form || !form.classList || !form.classList.contains('spa-form')) return;
      e.preventDefault();
      var data = formToObject(form);
      var action = data.action;
      delete data.action;
      delete data.sid;
      if (!data.mfaToken) {
        var storedMfa = getMfaToken();
        if (storedMfa) data.mfaToken = storedMfa;
      }
      if (!action) return;
      runAction(action, data);
    }, true);

    return {
      navigate: navigate, runAction: runAction, goBack: goBack, canGoBack: canGoBack,
      goForward: goForward, canGoForward: canGoForward,
      getSid: getSid, setSid: setSid, userLinkHtml: userLinkHtml, whatsappLinkHtml: whatsappLinkHtml,
      exerciseLinkHtml: exerciseLinkHtml,
      invalidatePageCache: invalidateClientPageCache,
      invalidateRoutes: invalidateClientRoutes,
      startAppPriming: startAppPriming,
      startStagedLoad: startStagedLoad,
      isPriming: function() { return !!loadStage.running || !!primingInProgress; },
      getLoadStage: function() {
        return {
          dashboard: !!loadStage.dashboard,
          exercises: !!loadStage.exercises,
          remaining: !!loadStage.remaining,
          running: !!loadStage.running
        };
      },
      parseSpaParams: parseSpaParams, runScripts: runScripts, afterRender: afterRender,
      boot: boot, applyResult: applyResult, showLoader: MapimLoader.show, hideLoader: MapimLoader.hide
    };
  })();

  // Save participant row — optimistic UI (אין המתנה לרינדור דף מלא)
  function spaSaveAssignmentRow(btn) {
    if (!btn || !window.MapimSpa) return;
    var row = btn.closest('tr');
    if (!row) return;
    var assignmentId = row.getAttribute('data-assignment-id') || '';
    var exerciseId = row.getAttribute('data-exercise-id') || '';
    var pick = function(name) {
      var el = row.querySelector('[name="' + name + '"]');
      return el ? String(el.value || '').trim() : '';
    };
    if (!assignmentId) { alert('חסר מזהה הקצאה'); return; }

    var status = pick('status');
    var score = pick('score');
    var responsibility = pick('responsibility');
    var tutor = pick('tutor');

    btn.disabled = true;
    var prevText = btn.textContent;
    btn.textContent = 'שומר...';

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = prevText;
        if (!res || res.ok === false) {
          alert((res && res.error) || 'שגיאה בשמירה');
          return;
        }
        // optimistic: מסמנים הצלחה בלי רינדור מחדש של כל הדף
        btn.textContent = '✓ נשמר';
        setTimeout(function() { btn.textContent = prevText; }, 1200);
        if (window.MapimSpa && MapimSpa.invalidateRoutes) {
          MapimSpa.invalidateRoutes(['dashboard', 'assign', 'exercise', 'statistics']);
        }
        var flash = document.getElementById('spa-inline-flash');
        if (!flash) {
          flash = document.createElement('div');
          flash.id = 'spa-inline-flash';
          flash.className = 'flash flash-ok';
          flash.style.cssText = 'position:fixed;bottom:20px;left:20px;z-index:9999;padding:10px 14px;';
          document.body.appendChild(flash);
        }
        flash.textContent = (res && res.info) || 'נשמר';
        flash.hidden = false;
        setTimeout(function() { flash.hidden = true; }, 2000);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = prevText;
        alert(err && err.message ? err.message : String(err));
      })
      .apiUpdateAssignment(
        MapimSpa.getSid(),
        assignmentId,
        exerciseId,
        status,
        score,
        responsibility,
        tutor
      );
  }
  window.spaSaveAssignmentRow = spaSaveAssignmentRow;

  function initDashboardUserSearch() {
    var input = document.getElementById('dashboardUserSearch');
    var results = document.getElementById('dashboardUserSearchResults');
    var btn = document.getElementById('dashboardUserSearchBtn');
    if (!input || !results) return;

    var users = [];
    try {
      users = JSON.parse(input.getAttribute('data-users') || '[]');
    } catch (e) {
      users = [];
    }

    var selectedId = input.getAttribute('data-selected-id') || '';
    if (selectedId) input.dataset.selectedUserId = selectedId;

    var activeIdx = -1;

    function hideResults() {
      results.hidden = true;
      results.innerHTML = '';
      activeIdx = -1;
    }

    function selectUser(id, label) {
      if (!id) return;
      input.dataset.selectedUserId = id;
      if (label) input.value = label;
      hideResults();
    }

    function resolveUserId() {
      var userId = input.dataset.selectedUserId || '';
      if (userId) return userId;
      var q = String(input.value || '').trim().toLowerCase();
      if (!q) return '';
      var exact = users.find(function(u) {
        return String(u.id || '').toLowerCase() === q ||
          String(u.name || '').toLowerCase() === q;
      });
      if (exact) return exact.id;
      var matches = users.filter(function(u) {
        return String(u.id || '').toLowerCase().indexOf(q) !== -1 ||
          String(u.name || '').toLowerCase().indexOf(q) !== -1;
      });
      if (matches.length === 1) return matches[0].id;
      return '';
    }

    function runUserExerciseSearch() {
      var userId = resolveUserId();
      if (!userId) {
        alert('בחר משתמש מהרשימה או הזן שם / מספר אישי מדויק');
        return;
      }
      if (!window.MapimSpa) return;
      MapimSpa.navigate('dashboard', { searchUserId: userId });
    }

    function renderMatches(q) {
      var query = String(q || '').trim().toLowerCase();
      input.dataset.selectedUserId = '';
      if (!query) {
        hideResults();
        return;
      }
      var matches = users.filter(function(u) {
        return String(u.id || '').toLowerCase().indexOf(query) !== -1 ||
          String(u.name || '').toLowerCase().indexOf(query) !== -1;
      }).slice(0, 10);

      if (!matches.length) {
        results.innerHTML = '<div style="padding:10px 12px;color:var(--muted);font-size:12px">לא נמצאו משתמשים</div>';
        results.hidden = false;
        return;
      }

      results.innerHTML = matches.map(function(u, i) {
        return '<button type="button" class="user-search-item' + (i === activeIdx ? ' active' : '') + '" data-user-id="' +
          String(u.id).replace(/"/g, '&quot;') + '" data-user-label="' +
          String(u.name + ' (' + u.id + ')').replace(/"/g, '&quot;') + '">' +
          '<span>' + String(u.name).replace(/</g, '&lt;') + '</span>' +
          '<small>' + String(u.id).replace(/</g, '&lt;') + ' · ' + String(u.role || '').replace(/</g, '&lt;') + '</small>' +
          '</button>';
      }).join('');
      results.hidden = false;

      results.querySelectorAll('.user-search-item').forEach(function(el) {
        el.addEventListener('mousedown', function(e) {
          e.preventDefault();
          selectUser(el.getAttribute('data-user-id'), el.getAttribute('data-user-label'));
        });
      });
    }

    if (!input._searchBound) {
      input._searchBound = true;
      input.addEventListener('input', function() {
        activeIdx = -1;
        renderMatches(input.value);
      });
      input.addEventListener('keydown', function(e) {
        var items = results.querySelectorAll('.user-search-item');
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (results.hidden) renderMatches(input.value);
          items = results.querySelectorAll('.user-search-item');
          activeIdx = Math.min(activeIdx + 1, items.length - 1);
          items.forEach(function(el, i) { el.classList.toggle('active', i === activeIdx); });
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeIdx = Math.max(activeIdx - 1, 0);
          items.forEach(function(el, i) { el.classList.toggle('active', i === activeIdx); });
        } else if (e.key === 'Enter') {
          if (!results.hidden && activeIdx >= 0 && items[activeIdx]) {
            e.preventDefault();
            selectUser(items[activeIdx].getAttribute('data-user-id'), items[activeIdx].getAttribute('data-user-label'));
          } else if (!results.hidden && items.length === 1) {
            e.preventDefault();
            selectUser(items[0].getAttribute('data-user-id'), items[0].getAttribute('data-user-label'));
          } else {
            e.preventDefault();
            runUserExerciseSearch();
          }
        } else if (e.key === 'Escape') {
          hideResults();
        }
      });
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.dashboard-search-panel')) hideResults();
      });
    }

    if (btn && !btn._searchBound) {
      btn._searchBound = true;
      btn.addEventListener('click', runUserExerciseSearch);
    }
  }
  window.initDashboardUserSearch = initDashboardUserSearch;

  function initAppExerciseCalendar(root) {
    if (!root || root._calBound) return;
    var grid = root.querySelector('.user-cal-grid');
    var monthLabel = root.querySelector('.user-cal-month-label');
    var dayDetail = root.querySelector('.user-cal-day-detail');
    var exportBtn = root.querySelector('button[id$="ExportIcs"]');
    var dataEl = root.querySelector('script[type="application/json"]');
    if (!grid || !dataEl) return;
    root._calBound = true;

    var payload = { events: [], fileName: 'mapim-exercises' };
    try { payload = JSON.parse(dataEl.textContent || '{}'); } catch (e) { /* ignore */ }
    var events = Array.isArray(payload.events) ? payload.events : [];
    if (!events.length) return;

    var HEB_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני',
      'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
    var HEB_DOW = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
    var cur = new Date();
    cur.setDate(1);
    cur.setHours(0, 0, 0, 0);

    function dayStartMs(y, m, d) {
      return new Date(y, m, d, 0, 0, 0, 0).getTime();
    }

    function eventTypeClass(type) {
      var t = String(type || '').replace(/״/g, '');
      if (t === 'חיר' || t.indexOf('חיר') !== -1) return 'type-green';
      if (t === 'חשן' || t.indexOf('חשן') !== -1) return 'type-blue';
      if (t === '900' || t.indexOf('900') !== -1) return 'type-yellow';
      return 'type-muted';
    }

    function eventsForDay(y, m, d) {
      var start = dayStartMs(y, m, d);
      var end = dayStartMs(y, m, d + 1);
      return events.filter(function(ev) {
        return (+ev.startMs) < end && (+ev.endMs) > start;
      });
    }

    function fmtExerciseWhen(ms) {
      var dt = new Date(+ms);
      return dt.getDate() + '/' + (dt.getMonth() + 1) + ' · ' +
        String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
    }

    function renderDetailItem(ev) {
      var link = window.MapimSpa && MapimSpa.exerciseLinkHtml
        ? MapimSpa.exerciseLinkHtml(ev.id, ev.title)
        : ('<b>' + ev.title + '</b>');
      var when = ev.schedule || (fmtExerciseWhen(ev.startMs) + ' – ' + fmtExerciseWhen(ev.endMs));
      var meta = when;
      if (ev.responsibility) meta += ' · ' + ev.responsibility;
      if (ev.status) meta += ' · ' + ev.status;
      if (ev.mpCount != null) meta += ' · מפים: ' + ev.mpCount;
      if (ev.type) meta += ' · ' + ev.type;
      if (ev.location && ev.location !== '—') meta += ' · ' + ev.location;
      var procBtn = '';
      if (ev.procedureCount) {
        procBtn = '<button type="button" class="btn btn-ghost btn-sm dash-proc-open-btn" data-dash-proc-open="' +
          ev.id + '">📋 נוה"ק (' + ev.procedureCount + ')</button>';
      }
      return '<div class="user-cal-detail-item">' + link +
        '<div style="font-size:11px;color:var(--muted);margin-top:4px">' + meta + '</div>' +
        procBtn + '</div>';
    }

    function showDayDetail(y, m, d) {
      if (!dayDetail) return;
      var list = eventsForDay(y, m, d);
      if (!list.length) {
        dayDetail.hidden = true;
        dayDetail.innerHTML = '';
        return;
      }
      var title = d + ' ב' + HEB_MONTHS[m] + ' ' + y;
      dayDetail.innerHTML = '<h4>תרגילים ב-' + title + '</h4>' +
        list.map(renderDetailItem).join('');
      dayDetail.hidden = false;
    }

    function renderCalendar() {
      var year = cur.getFullYear();
      var month = cur.getMonth();
      if (monthLabel) monthLabel.textContent = HEB_MONTHS[month] + ' ' + year;

      var firstDow = new Date(year, month, 1).getDay();
      var daysInMonth = new Date(year, month + 1, 0).getDate();
      var today = new Date();
      var html = '';
      HEB_DOW.forEach(function(d) { html += '<div class="user-cal-dow">' + d + '</div>'; });

      var cell = 0;
      for (var i = 0; i < firstDow; i++) {
        html += '<div class="user-cal-day empty"></div>';
        cell++;
      }
      for (var day = 1; day <= daysInMonth; day++) {
        var dayEvents = eventsForDay(year, month, day);
        var isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
        var cls = 'user-cal-day' + (isToday ? ' today' : '') + (dayEvents.length ? ' has-events' : '');
        html += '<div class="' + cls + '" data-cal-day="' + day + '">' +
          '<div class="user-cal-day-num">' + day + '</div>';
        dayEvents.slice(0, 3).forEach(function(ev) {
          html += '<div class="user-cal-event ' + eventTypeClass(ev.type) + '" title="' +
            ev.title.replace(/"/g, '&quot;') + '">' + ev.title + '</div>';
        });
        if (dayEvents.length > 3) {
          html += '<div class="user-cal-more">+' + (dayEvents.length - 3) + ' נוספים</div>';
        }
        html += '</div>';
        cell++;
      }
      while (cell % 7 !== 0) {
        html += '<div class="user-cal-day empty"></div>';
        cell++;
      }
      grid.innerHTML = html;

      grid.querySelectorAll('[data-cal-day]').forEach(function(el) {
        el.addEventListener('click', function() {
          showDayDetail(year, month, +el.getAttribute('data-cal-day'));
        });
      });
    }

    root.addEventListener('click', function(e) {
      var nav = e.target.closest('[data-app-cal-nav]');
      if (!nav) return;
      var action = nav.getAttribute('data-app-cal-nav');
      if (action === 'prev') cur.setMonth(cur.getMonth() - 1);
      else if (action === 'next') cur.setMonth(cur.getMonth() + 1);
      else if (action === 'today') {
        cur = new Date();
        cur.setDate(1);
        cur.setHours(0, 0, 0, 0);
      }
      if (dayDetail) dayDetail.hidden = true;
      renderCalendar();
    });

    function icsEscape(s) {
      return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;')
        .replace(/,/g, '\\,').replace(/\n/g, '\\n').replace(/\r/g, '');
    }

    function msToIcsLocal(ms) {
      var d = new Date(+ms);
      return String(d.getFullYear()) +
        String(d.getMonth() + 1).padStart(2, '0') +
        String(d.getDate()).padStart(2, '0') + 'T' +
        String(d.getHours()).padStart(2, '0') +
        String(d.getMinutes()).padStart(2, '0') +
        String(d.getSeconds()).padStart(2, '0');
    }

    function msToIcsUtc(ms) {
      return new Date(+ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z/, 'Z');
    }

    function downloadIcs() {
      var stamp = msToIcsUtc(Date.now());
      var lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Mapim//Exercises//HE',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH'
      ];
      events.forEach(function(ev) {
        var desc = [];
        if (ev.responsibility) desc.push('תפקיד: ' + ev.responsibility);
        if (ev.status) desc.push('סטטוס: ' + ev.status);
        if (ev.type) desc.push('סוג: ' + ev.type);
        if (ev.mpCount != null) desc.push('מפים: ' + ev.mpCount);
        lines.push('BEGIN:VEVENT');
        lines.push('UID:mapim-ex-' + ev.id + '@mapim');
        lines.push('DTSTAMP:' + stamp);
        lines.push('DTSTART;TZID=Asia/Jerusalem:' + msToIcsLocal(ev.startMs));
        lines.push('DTEND;TZID=Asia/Jerusalem:' + msToIcsLocal(ev.endMs));
        lines.push('SUMMARY;CHARSET=UTF-8:' + icsEscape(ev.title));
        if (ev.location) lines.push('LOCATION;CHARSET=UTF-8:' + icsEscape(ev.location));
        if (desc.length) lines.push('DESCRIPTION;CHARSET=UTF-8:' + icsEscape(desc.join(' | ')));
        lines.push('END:VEVENT');
      });
      lines.push('END:VCALENDAR');
      var blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      var a = document.createElement('a');
      var safeName = String(payload.fileName || payload.userName || 'exercises')
        .replace(/[^\w\u0590-\u05FF.-]+/g, '_');
      a.href = URL.createObjectURL(blob);
      a.download = safeName + '.ics';
      document.body.appendChild(a);
      a.click();
      setTimeout(function() {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 0);
    }

    if (exportBtn) exportBtn.addEventListener('click', downloadIcs);

    var now = new Date();
    var hasThisMonth = events.some(function(ev) {
      var d = new Date(+ev.startMs);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
    if (!hasThisMonth) {
      var firstMs = events.reduce(function(min, ev) {
        return Math.min(min, +ev.startMs);
      }, Infinity);
      if (isFinite(firstMs)) {
        cur = new Date(firstMs);
        cur.setDate(1);
        cur.setHours(0, 0, 0, 0);
      }
    }
    renderCalendar();
  }

  function initDashboardProcedurePeek() {
    var root = document.getElementById('dashboardUserExerciseResults');
    if (!root || root._procBound) return;
    root._procBound = true;

    function setOpen(exId, open) {
      var row = document.getElementById('dash-proc-row-' + exId);
      var btn = root.querySelector('[data-dash-proc="' + exId + '"]');
      if (!row || !btn) return false;
      row.hidden = !open;
      btn.classList.toggle('active', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.textContent = open ? '▴ סגור נוה"ק' : ('📋 נוה"ק (' + (btn.getAttribute('data-proc-count') || '0') + ')');
      return true;
    }

    function toggleProcedure(exId) {
      var row = document.getElementById('dash-proc-row-' + exId);
      if (!row) return false;
      var willOpen = row.hidden;
      root.querySelectorAll('.dash-proc-row').forEach(function(r) {
        if (!r.hidden && r.id !== 'dash-proc-row-' + exId) {
          var otherId = r.id.replace('dash-proc-row-', '');
          setOpen(otherId, false);
        }
      });
      setOpen(exId, willOpen);
      if (willOpen) {
        try { row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) { /* ignore */ }
      }
      return true;
    }

    window.openDashboardProcedure = toggleProcedure;

    root.addEventListener('click', function(e) {
      var openBtn = e.target.closest('[data-dash-proc-open]');
      if (openBtn) {
        e.preventDefault();
        e.stopPropagation();
        toggleProcedure(openBtn.getAttribute('data-dash-proc-open'));
        return;
      }
      var btn = e.target.closest('.dash-proc-btn');
      if (!btn || !root.contains(btn)) return;
      e.preventDefault();
      e.stopPropagation();
      toggleProcedure(btn.getAttribute('data-dash-proc'));
    });
  }

    document.querySelectorAll('form.exercise-edit-form').forEach(function(form) {

      form._shiftBound = true;
      form.addEventListener('submit', function(e) {
        if (form._shiftConfirmed) {
          form._shiftConfirmed = false;
          return;
        }
        var origDate = form.getAttribute('data-orig-start-date') || '';
        var origTime = form.getAttribute('data-orig-start-time') || '';
        var origEndDate = form.getAttribute('data-orig-end-date') || '';
        var origEndTime = form.getAttribute('data-orig-end-time') || '';
        var procCount = parseInt(form.getAttribute('data-procedure-count') || '0', 10);
        var fd = new FormData(form);

        var newEndDate = String(fd.get('end_date') || '').trim();
        var newEndTime = String(fd.get('end_time') || '').trim();
        var startChanged = origDate !== newDate || origTime !== newTime;
        var endChanged = origEndDate !== newEndDate || origEndTime !== newEndTime;
        if ((!startChanged && !endChanged) || procCount <= 0) return;

        e.preventDefault();

          'שינית את זמני התרגיל.\n\nלעדכן את לוז נוהל הקרב בהתאם (הזזת כל האירועים באותו הפרש)?'

        var anchorInp = form.querySelector('input[name="shift_anchor"]');
        if (inp) inp.value = yes ? '1' : '';
        if (anchorInp) anchorInp.value = yes ? (startChanged ? 'start' : 'end') : '';
        form._shiftConfirmed = true;

        else form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      }, true);
    });

  function initTimeWheelPickers() {
    var HALF_HOUR_TIMES = [];
    for (var h = 0; h < 24; h++) {
      var hh = String(h).padStart(2, '0');
      HALF_HOUR_TIMES.push(hh + ':00');
      HALF_HOUR_TIMES.push(hh + ':30');
    }

    function normalizeTimeHm(s) {
      var m = String(s || '').trim().match(/^(\d{1,2}):(\d{2})$/);
      if (!m) return '';
      var hr = parseInt(m[1], 10);
      var min = parseInt(m[2], 10);
      if (isNaN(hr) || isNaN(min) || hr > 23 || min > 59) return '';
      return String(hr).padStart(2, '0') + ':' + String(min).padStart(2, '0');
    }

    function nearestHalfHour(s) {
      var norm = normalizeTimeHm(s);
      if (!norm) return '';
      var parts = norm.split(':').map(Number);
      var mins = parts[0] * 60 + parts[1];
      var snapped = Math.round(mins / 30) * 30;
      if (snapped >= 24 * 60) snapped = 23 * 60 + 30;
      var nh = Math.floor(snapped / 60);
      var nm = snapped % 60;
      return String(nh).padStart(2, '0') + ':' + String(nm).padStart(2, '0');
    }

    function closeAll(except) {
      document.querySelectorAll('.time-wheel-wrap').forEach(function(w) {
        if (except && w === except) return;
        var popup = w.querySelector('.time-wheel-popup');
        if (popup) popup.hidden = true;
        w.classList.remove('open');
      });
    }

    function scrollToValue(list, value) {
      var target = list.querySelector('[data-time="' + value + '"]');
      if (!target) target = list.querySelector('.time-wheel-item');
      if (!target) return;
      var top = target.offsetTop - (list.clientHeight / 2) + (target.offsetHeight / 2);
      list.scrollTop = Math.max(0, top);
    }

    function markSelected(list, value) {
      list.querySelectorAll('.time-wheel-item').forEach(function(item) {
        item.classList.toggle('selected', item.getAttribute('data-time') === value);
      });
    }

    function setValue(wrap, input, value) {
      var norm = nearestHalfHour(value) || normalizeTimeHm(value) || value;
      if (norm) input.value = norm;
      var list = wrap.querySelector('.time-wheel-list');
      if (list) markSelected(list, norm);
    }

    function openWheel(wrap) {
      var popup = wrap.querySelector('.time-wheel-popup');
      var input = wrap.querySelector('.time-half-input');
      var list = wrap.querySelector('.time-wheel-list');
      if (!popup || !input || !list) return;
      closeAll(wrap);
      popup.hidden = false;
      wrap.classList.add('open');
      var val = nearestHalfHour(input.value) || input.value || '08:00';
      scrollToValue(list, HALF_HOUR_TIMES.indexOf(val) >= 0 ? val : '08:00');
      markSelected(list, val);
    }

    document.querySelectorAll('.time-wheel-wrap').forEach(function(wrap) {
      if (wrap._timeWheelBound) return;
      wrap._timeWheelBound = true;

      var input = wrap.querySelector('.time-half-input');
      var btn = wrap.querySelector('.time-wheel-btn');
      var popup = wrap.querySelector('.time-wheel-popup');
      var list = wrap.querySelector('.time-wheel-list');
      if (!input || !popup || !list) return;

      if (!list.childElementCount) {
        HALF_HOUR_TIMES.forEach(function(t) {
          var item = document.createElement('div');
          item.className = 'time-wheel-item';
          item.setAttribute('data-time', t);
          item.setAttribute('role', 'option');
          item.textContent = t;
          list.appendChild(item);
        });
      }

      function pick(time) {
        setValue(wrap, input, time);
        popup.hidden = true;
        wrap.classList.remove('open');
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }

      if (btn) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          if (popup.hidden) openWheel(wrap);
          else { popup.hidden = true; wrap.classList.remove('open'); }
        });
      }

      input.addEventListener('click', function() {
        openWheel(wrap);
      });

      input.addEventListener('blur', function() {
        var norm = normalizeTimeHm(input.value);
        if (norm) input.value = norm;
      });

      input.addEventListener('change', function() {
        var norm = normalizeTimeHm(input.value);
        if (norm) input.value = norm;
      });

      list.addEventListener('mousedown', function(e) {
        var item = e.target.closest('.time-wheel-item');
        if (!item) return;
        e.preventDefault();
        pick(item.getAttribute('data-time'));
      });

      var scrollTimer = null;
      list.addEventListener('scroll', function() {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function() {
          var center = list.scrollTop + list.clientHeight / 2;
          var best = null;
          var bestDist = Infinity;
          list.querySelectorAll('.time-wheel-item').forEach(function(item) {
            var mid = item.offsetTop + item.offsetHeight / 2;
            var dist = Math.abs(mid - center);
            if (dist < bestDist) {
              bestDist = dist;
              best = item;
            }
          });
          if (best) {
            var t = best.getAttribute('data-time');
            markSelected(list, t);
            input.value = t;
          }
        }, 80);
      });
    });

    if (!window._timeWheelDocBound) {
      window._timeWheelDocBound = true;
      document.addEventListener('click', function(e) {
        if (e.target.closest('.time-wheel-wrap')) return;
        closeAll(null);
      });
    }
  }

  function initDatePickers() {
    document.querySelectorAll('.dp-wrap').forEach(wrap => {
      const hidden  = wrap.querySelector('input[type=hidden]');
      const trigger = wrap.querySelector('.dp-trigger');
      const popup   = wrap.querySelector('.dp-popup');
      const valSpan = trigger.querySelector('.dp-val');

      let cur = new Date();
      cur.setDate(1);
      let selectedDate = null;
      let yearMode = false;

      // Parse existing value
      if (hidden.value) {
        const parts = hidden.value.split('-');
        if (parts.length === 3) {
          selectedDate = new Date(+parts[0], +parts[1]-1, +parts[2]);
          cur = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
          updateTriggerLabel();
        }
      }

      function updateTriggerLabel() {
        if (selectedDate) {
          const d = selectedDate;
          const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
          valSpan.innerHTML = '<span>' + days[d.getDay()] + ', ' + d.getDate() + ' ב' + HEB_MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '</span>';
        } else {
          valSpan.innerHTML = '<span class="dp-placeholder">בחר תאריך...</span>';
        }
      }

      function renderCalendar() {
        if (yearMode) { renderYearGrid(); return; }
        const year = cur.getFullYear(), month = cur.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const today = new Date();

        let html = '<div class="dp-header">' +
          '<button type="button" class="dp-nav" data-action="prev">&#8250;</button>' +
          '<span class="dp-month-label" data-action="year-mode">' + HEB_MONTHS[month] + ' ' + year + '</span>' +
          '<button type="button" class="dp-nav" data-action="next">&#8249;</button>' +
          '</div><div class="dp-grid">';
        HEB_DAYS_SHORT.forEach(d => { html += '<div class="dp-dow">' + d + '</div>'; });
        // empty cells before first day
        for (let i = 0; i < firstDay; i++) html += '<div class="dp-day empty"></div>';
        for (let d = 1; d <= daysInMonth; d++) {

        let html = '<div class="dp-header">' +
          '<button type="button" class="dp-nav" data-action="year-prev">&#8250;</button>' +

        });

      function handleNav(action) {
        if (action === 'prev') { cur.setMonth(cur.getMonth()-1); renderCalendar(); }
        else if (action === 'next') { cur.setMonth(cur.getMonth()+1); renderCalendar(); }
        else if (action === 'year-mode') { yearMode = true; renderCalendar(); }
        else if (action === 'year-prev') { cur.setFullYear(cur.getFullYear()-12); renderCalendar(); }
        else if (action === 'year-next') { cur.setFullYear(cur.getFullYear()+12); renderCalendar(); }

          const rect = trigger.getBoundingClientRect();
          const popW = 272, popH = 280;
          let top = rect.bottom + 4;
          let left = rect.right - popW;
          // Flip above if not enough room below
          if (top + popH > window.innerHeight - 10) top = rect.top - popH - 4;
          // Keep within left edge
          if (left < 8) left = 8;
          // Keep within right edge
          if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
          popup.style.top = top + 'px';
          popup.style.left = left + 'px';
        }

  // ══ Hebrew-safe CSV importer ══
  (function(){

    // Read file as ArrayBuffer, detect encoding from BOM and byte content,
    // then decode correctly — handles UTF-8, UTF-8 BOM, and Windows-1255 (Hebrew Excel)
    function readFileHebrew(file, cb) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var buf = e.target.result;
        var bytes = new Uint8Array(buf);

        // Check for UTF-8 BOM (EF BB BF)
        if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
          cb(new TextDecoder('utf-8').decode(buf.slice(3)));
          return;
        }

        // Check for UTF-16 LE BOM (FF FE)
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) {
          cb(new TextDecoder('utf-16le').decode(buf.slice(2)));
          return;
        }

        // Try UTF-8 first
        try {
          var utfText = new TextDecoder('utf-8', { fatal: true }).decode(buf);
          // Valid UTF-8 — check if Hebrew chars are present (U+05D0–U+05EA range)
          // If so, great. If text looks like question marks, fall through.
          cb(utfText);
        } catch(e) {
          // Not valid UTF-8 — must be Windows-1255 (Hebrew Excel default)
          try {
            cb(new TextDecoder('windows-1255').decode(buf));
          } catch(e2) {
            // Last resort: ISO-8859-8 (Hebrew)
            cb(new TextDecoder('iso-8859-8').decode(buf));
          }
        }
      };
      reader.onerror = function() { cb(''); };
      reader.readAsArrayBuffer(file);
    }

    function parseCSVorTSV(text) {
      text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
      if (!text) throw new Error('הקובץ ריק.');
      var lines = text.split('\n').filter(function(l){return l.trim();});
      if (lines.length < 2) throw new Error('נדרשת שורת כותרת + לפחות שורת נתונים.');

      // Auto-detect delimiter
      var delim = lines[0].indexOf('\t') > -1 ? '\t' : ',';

      var headers = splitLine(lines[0], delim).map(function(h){
        return h.trim().toLowerCase().replace(/^"|"$/g,'').replace(/^\uFEFF/,'');
      });

      var req = ['id','name','password'];
      var miss = req.filter(function(r){return headers.indexOf(r) < 0;});
      if (miss.length) throw new Error('חסרות עמודות: ' + miss.join(', ') + '\nעמודות שנמצאו: ' + headers.join(', '));

      return lines.slice(1).map(function(line) {
        var vals = splitLine(line, delim);
        var obj  = {};
        headers.forEach(function(h,i){ obj[h] = (vals[i]||'').trim().replace(/^"|"$/g,''); });
        return obj;
      }).filter(function(r){ return r.id; });
    }

    function splitLine(line, delim) {
      if (delim === '\t') return line.split('\t');
      var res=[], cur='', inQ=false;
      for (var i=0; i<line.length; i++) {
        var ch=line[i];
        if (ch==='"'){inQ=!inQ;continue;}
        if (ch===delim&&!inQ){res.push(cur);cur='';continue;}
        cur+=ch;
      }
      res.push(cur);
      return res;
    }

    function showPreview(rows, previewTbl, preview, importBtn, errDiv) {
      if (!rows.length) { showErr(errDiv,'לא נמצאו שורות תקינות.'); return; }
      var cols=['id','name','password','role','team_id'];
      var tbl='<table class="tbl" style="font-size:11px"><thead><tr>'+
        cols.map(function(c){return '<th>'+c+'</th>';}).join('')+
        '</tr></thead><tbody>';
      rows.slice(0,8).forEach(function(row){
        tbl+='<tr>'+cols.map(function(col){
          var val=row[col]||'';
          return '<td>'+(col==='password'?'••••':val)+'</td>';
        }).join('')+'</tr>';
      });
      if(rows.length>8) tbl+='<tr><td colspan="'+cols.length+'" style="color:var(--muted);text-align:center;font-family:var(--mono);font-size:11px">… ועוד '+(rows.length-8)+' שורות</td></tr>';
      tbl+='</tbody></table>';
      tbl+='<div style="font-family:var(--mono);font-size:11px;color:var(--green);margin-top:8px">✓ '+rows.length+' משתמשים לייבוא</div>';
      previewTbl.innerHTML = tbl;
      preview.style.display   = 'block';
      importBtn.style.display = 'inline-block';
      importBtn._rows = rows;
    }

    function showErr(errDiv, msg) {
      errDiv.textContent   = '⚠ ' + msg;
      errDiv.style.display = 'block';
    }

    function onFileChange(input) {
      var preview    = document.getElementById('xlsxPreview');
      var previewTbl = document.getElementById('xlsxPreviewTable');
      var errDiv     = document.getElementById('xlsxError');
      var importBtn  = document.getElementById('xlsxImportBtn');
      if (!preview) return;
      errDiv.style.display    = 'none';
      preview.style.display   = 'none';
      importBtn.style.display = 'none';
      importBtn._rows         = null;
      var file = input.files && input.files[0];
      if (!file) return;

      readFileHebrew(file, function(text) {
        try {
          var rows = parseCSVorTSV(text);
          showPreview(rows, previewTbl, preview, importBtn, errDiv);
        } catch(err) {
          showErr(errDiv, err.message);
        }
      });
    }

    window.doXlsxImport = function() {
      var btn  = document.getElementById('xlsxImportBtn');
      var rows = btn && btn._rows;
      if (!rows || !rows.length) return;
      btn.textContent = '⏳ מייבא...';
      btn.disabled    = true;
      MapimLoader.show('// IMPORTING...');
      var payload = rows.map(function(r){
        return {id:r.id||'',name:r.name||'',password:r.password||'',
                role:r.role||'trainee',team_id:r.team_id||''};
      });
      MapimSpa.runAction('importUsers', { usersJson: JSON.stringify(payload) });
    };

    document.addEventListener('change', function(e){
      if (e.target && e.target.id === 'xlsxFile') onFileChange(e.target);
    });
  })();
